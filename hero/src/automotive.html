<body>
<div id="vignette"></div>
<div id="fade"></div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = 1920, H = 1080, DUR = 7.0;
const CYAN = new THREE.Color("#4cc4ff");
const BLUE = new THREE.Color("#1d64ff");
const RED  = new THREE.Color("#ff2a2a");

/* ---------- easing ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x020814, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

/* =========================================================
   CAR — procedural full-size sedan in the spirit of The new GRANDEUR
   profile coords: x 0 = nose → 5.03 = tail (metres), y up
   world: front faces +X (worldX = L/2 - x), right side = +Z
   ========================================================= */
const L = 5.03;
const TOP = [[0,0.60],[0.03,0.68],[0.10,0.74],[0.30,0.775],[0.70,0.82],[1.20,0.875],[1.62,0.925],[1.85,1.05],
  [2.10,1.21],[2.35,1.35],[2.60,1.425],[2.95,1.455],[3.40,1.46],[3.75,1.445],[4.05,1.385],[4.30,1.28],
  [4.50,1.16],[4.66,1.075],[4.82,1.05],[4.96,1.04],[5.005,1.00],[5.025,0.90],[5.03,0.72]];
function yTop(x) {
  x = clamp(x, 0, L);
  let i = 0; while (i < TOP.length - 2 && TOP[i + 1][0] < x) i++;
  const p0 = TOP[Math.max(0, i - 1)], p1 = TOP[i], p2 = TOP[i + 1], p3 = TOP[Math.min(TOP.length - 1, i + 2)];
  const u = (x - p1[0]) / (p2[0] - p1[0]), u2 = u * u, u3 = u2 * u;
  return 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3);
}
const FX = 0.98, RX = 3.875, WR = 0.43, WCY = 0.35, TIRE_R = 0.35;
const belt = x => lerp(0.97, 1.02, clamp((x - 1.6) / 2.9));
function yBot(x) {
  let y = 0.20;
  if (x < 0.30) y = 0.20 + 0.18 * Math.pow(1 - x / 0.30, 2);
  if (x > 4.70) y = 0.20 + 0.25 * Math.pow((x - 4.70) / 0.33, 2);
  for (const c of [FX, RX]) { const d = x - c; if (Math.abs(d) < WR) y = Math.max(y, WCY + Math.sqrt(WR * WR - d * d)); }
  return y;
}
const halfW = x => { const t = Math.abs((x - L / 2) / (L / 2)); return 0.94 * Math.pow(Math.max(0, 1 - Math.pow(t, 4.2)), 0.30); };

// right half-section (z >= 0), bottom-centre → top-centre, fixed point count (24)
function section(x) {
  const w = halfW(x), yt = yTop(x), yb = Math.min(yBot(x), yt - 0.06), bl = belt(x);
  const rb = Math.min(0.12, w * 0.4, (yt - yb) * 0.3), sideTop = Math.min(yt, bl);
  const rs = Math.min(0.15, w * 0.35, (sideTop - yb) * 0.35);
  const cabH = Math.max(0, yt - bl);
  const wc0 = Math.max(0, w - rs);
  const wr = wc0 * (1 - 0.26 * smooth(0, 0.3, cabH));
  const rr = Math.min(0.10, cabH * 0.5, wr * 0.5);
  const pts = [];
  const push = (z, y) => pts.push([Math.max(0, z), y]);
  for (let i = 0; i < 3; i++) push(lerp(0, w - rb, i / 3), yb);
  for (let i = 0; i < 4; i++) { const a = -Math.PI / 2 + (i / 3) * Math.PI / 2; push(w - rb + rb * Math.cos(a), yb + rb + rb * Math.sin(a)); }
  for (let i = 1; i < 4; i++) push(w + BULGE * Math.sin(Math.PI * i / 4) * Math.min(1, w / 0.6), lerp(yb + rb, sideTop - rs, i / 4));
  for (let i = 0; i < 4; i++) { const a = (i / 3) * Math.PI / 2; push(w - rs + rs * Math.cos(a), sideTop - rs + rs * Math.sin(a)); }
  for (let i = 1; i < 5; i++) push(lerp(wc0, wr, i / 5), lerp(sideTop, yt - rr, i / 5));
  for (let i = 0; i < 3; i++) { const a = (i / 2) * Math.PI / 2; push(wr - rr + rr * Math.cos(a), yt - rr + rr * Math.sin(a)); }
  for (let i = 1; i <= 3; i++) push(lerp(wr - rr, 0, i / 3), yt);
  const a45 = Math.PI / 4;
  const edge = cabH > 0.04 ? [wr - rr + rr * Math.cos(a45), yt - rr + rr * Math.sin(a45)]
                           : [w - rs + rs * Math.cos(a45), sideTop - rs + rs * Math.sin(a45)];
  return { pts, w, yt, yb, bl, rb, rs, sideTop, cabH, wc0, wr, rr, edge };
}
const BULGE = 0.03;
const wx = x => L / 2 - x;
// outer surface |z| at height y on the flank (interpolated along the section polyline)
function sideZ(x, y) {
  const P = section(x).pts.slice(3, 15);
  for (let i = 0; i < P.length - 1; i++) {
    const [z0, y0] = P[i], [z1, y1] = P[i + 1];
    if ((y - y0) * (y - y1) <= 0 && y1 !== y0) return lerp(z0, z1, (y - y0) / (y1 - y0));
  }
  return y < P[0][1] ? P[0][0] : P[P.length - 1][0];
}
// front-most / rear-most profile x for a given |z| (plan outline)
function noseX(z, rear = false) {
  let a = rear ? L / 2 : 0, b = rear ? L : L / 2;
  for (let i = 0; i < 30; i++) { const m = (a + b) / 2; const inside = halfW(m) >= Math.abs(z);
    if (rear) { if (inside) a = m; else b = m; } else { if (inside) b = m; else a = m; } }
  return (a + b) / 2;
}

/* ---------- shared uniforms ---------- */
const uni = { uScan: { value: 10 }, uTime: { value: 0 }, uReal: { value: 10 } };

/* ---------- hologram materials (scan-in, then hand over to the real car) ---------- */
const maskChunk = `
  float band = exp(-pow((vW.x - uScan) * 7.0, 2.0));
  float vis = smoothstep(uScan - 0.02, uScan + 0.06, vW.x);
  float keep = 1.0 - smoothstep(uReal - 0.06, uReal + 0.06, vW.x);
`;
function lineMat(color, opacity) {
  return new THREE.ShaderMaterial({
    uniforms: { ...uni, uColor: { value: color }, uOpacity: { value: opacity } },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity, uScan, uReal; varying vec3 vW;
      void main(){ ${maskChunk} float a = (uOpacity*vis + band*0.5*step(-5.0,uScan))*keep;
        gl_FragColor = vec4(uColor*(1.0+band*0.8)*a, 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
  });
}
function surfMat(color, strength) {
  return new THREE.ShaderMaterial({
    uniforms: { ...uni, uColor: { value: color }, uStr: { value: strength } },
    vertexShader: `varying vec3 vW; varying vec3 vN; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz;
      vN = normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uStr, uScan, uReal; varying vec3 vW; varying vec3 vN;
      void main(){ ${maskChunk} vec3 v = normalize(cameraPosition - vW); float f = 1.0 - abs(dot(normalize(vN), v));
        float fr = pow(f, 3.0)*0.9 + 0.015;
        gl_FragColor = vec4((uColor*fr*uStr*vis + uColor*band*0.35)*keep, 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false,
  });
}

/* ---------- realistic materials (revealed behind the second scan) ---------- */
function revealable(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uReal = uni.uReal;
    sh.vertexShader = "varying vec3 vWR;\n" + sh.vertexShader.replace("#include <project_vertex>",
      "#include <project_vertex>\n vWR = (modelMatrix * vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = "uniform float uReal; varying vec3 vWR;\n" + sh.fragmentShader
      .replace("void main() {", "void main() {\n if (vWR.x < uReal) discard;")
      .replace("#include <dithering_fragment>", "#include <dithering_fragment>\n gl_FragColor.rgb += vec3(0.25,0.7,1.0) * exp(-pow((vWR.x - uReal) * 9.0, 2.0)) * 0.45;");
  };
  return mat;
}
const MAT = {
  paint:  revealable(new THREE.MeshPhysicalMaterial({ color: "#3a434e", metalness: 0.5, roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.18 })),
  glass:  revealable(new THREE.MeshPhysicalMaterial({ color: "#010203", metalness: 0.0, roughness: 0.04, envMapIntensity: 0.3, specularIntensity: 0.35 })),
  trim:   revealable(new THREE.MeshPhysicalMaterial({ color: "#0c0d0f", metalness: 0.2, roughness: 0.38, clearcoat: 0.6 })),
  chrome: revealable(new THREE.MeshStandardMaterial({ color: "#9aa0a7", metalness: 1, roughness: 0.38, envMapIntensity: 0.45 })),
  tire:   revealable(new THREE.MeshStandardMaterial({ color: "#141516", metalness: 0, roughness: 0.86 })),
  rim:    revealable(new THREE.MeshStandardMaterial({ color: "#7d848c", metalness: 1, roughness: 0.42, envMapIntensity: 0.45 })),
  rimDark:revealable(new THREE.MeshStandardMaterial({ color: "#16181b", metalness: 0.6, roughness: 0.35 })),
  drl:    revealable(new THREE.MeshStandardMaterial({ color: "#000", emissive: "#e8f4ff", emissiveIntensity: 0 })),
  tail:   revealable(new THREE.MeshStandardMaterial({ color: "#200000", emissive: "#ff1a10", emissiveIntensity: 0 })),
};

/* ---------- body: hologram mesh + wire, real mesh with material zones ---------- */
const car = new THREE.Group(); scene.add(car);
const NX = 200;
const xs = []; for (let i = 0; i <= NX; i++) xs.push(L * (0.5 - 0.5 * Math.cos(Math.PI * i / NX)));
const secs = xs.map(section);
const rings = xs.map((x, i) => {
  const s = secs[i];
  const right = s.pts.map(([z, y]) => new THREE.Vector3(wx(x), y, z));
  const left = s.pts.slice(1, -1).reverse().map(([z, y]) => new THREE.Vector3(wx(x), y, -z));
  return right.concat(left);
});
const M = rings[0].length, HN = secs[0].pts.length;
const halfIdx = j => j < HN ? j : 2 * HN - 2 - j;
{
  const pos = [];
  rings.forEach(r => r.forEach(p => pos.push(p.x, p.y, p.z)));
  const zones = { paint: [], glass: [], trim: [] };
  for (let i = 0; i < NX; i++) for (let j = 0; j < M; j++) {
    const a = i * M + j, b = i * M + (j + 1) % M, c = (i + 1) * M + j, d = (i + 1) * M + (j + 1) % M;
    const x = (xs[i] + xs[i + 1]) / 2, h = Math.min(halfIdx(j), halfIdx((j + 1) % M)), y = (rings[i][j].y + rings[i][(j + 1) % M].y) / 2;
    let z = "paint";
    if (h < 3 || (h < 10 && y < 0.36)) z = "trim";                                // underbody, arches, lower cladding
    else if (h >= 13 && h < 18 && x > 1.64 && x < 4.70 && secs[i].cabH > 0.05) z = "glass";   // side glass / pillars (black)
    else if (h >= 18 && ((x > 1.66 && x < 2.50) || (x > 4.02 && x < 4.68))) z = "glass";       // windshield / rear glass
    zones[z].push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const idx = [...zones.paint, ...zones.glass, ...zones.trim];
  g.setIndex(idx);
  g.addGroup(0, zones.paint.length, 0);
  g.addGroup(zones.paint.length, zones.glass.length, 1);
  g.addGroup(zones.paint.length + zones.glass.length, zones.trim.length, 2);
  g.computeVertexNormals();
  car.add(new THREE.Mesh(g, [MAT.paint, MAT.glass, MAT.trim]));
  car.add(new THREE.Mesh(g, surfMat(BLUE.clone().lerp(CYAN, .35), 0.24)));

  const lp = [];
  for (let i = 0; i <= NX; i += 7) for (let j = 0; j < M; j++) { const p = rings[i][j], q = rings[i][(j + 1) % M]; lp.push(p.x, p.y, p.z, q.x, q.y, q.z); }
  for (let j = 0; j < M; j += 2) for (let i = 0; i < NX; i++) { const p = rings[i][j], q = rings[i + 1][j]; lp.push(p.x, p.y, p.z, q.x, q.y, q.z); }
  const lg = new THREE.BufferGeometry(); lg.setAttribute("position", new THREE.Float32BufferAttribute(lp, 3));
  car.add(new THREE.LineSegments(lg, lineMat(CYAN, 0.14)));
}

/* ---------- helpers ---------- */
function fat(points, color, width, opacity = 1, closed = false) {
  const P = closed ? points.concat([points[0]]) : points;
  const arr = [];
  for (let i = 0; i < P.length - 1; i++) arr.push(P[i].x, P[i].y, P[i].z, P[i + 1].x, P[i + 1].y, P[i + 1].z);
  const g = new LineSegmentsGeometry(); g.setPositions(arr);
  const m = new LineMaterial({ color, linewidth: width, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false });
  m.resolution.set(W, H);
  const l = new LineSegments2(g, m); l.userData.n = P.length - 1; l.userData.pts = P; l.userData.o = opacity;
  return l;
}
const tube = (points, r, mat, closed = false) => {
  const curve = new THREE.CatmullRomCurve3(points, closed);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(8, points.length * 3), r, 8, closed), mat);
};
const sample = (a, b, n, f) => { const o = []; for (let i = 0; i <= n; i++) o.push(f(lerp(a, b, i / n))); return o; };
const sidePt = (x, y, s = 1, off = 0.012) => new THREE.Vector3(wx(x), y, s * (sideZ(x, y) + off));
const edgePt = (x, s = 1, off = 0.012) => { const e = section(x).edge; return new THREE.Vector3(wx(x), e[1] + off, s * (e[0] + off)); };
const topPt = (x, z, off = 0.012) => new THREE.Vector3(wx(x), yTop(x) + off, z);
const fatIn = group => { const list = []; group.traverse(o => { if (o.material && o.material.isLineMaterial) list.push(o); }); return list; };

/* ---------- real-car details ---------- */
const details = new THREE.Group(); car.add(details);
const winBottom = (x, s) => { const q = section(x); return new THREE.Vector3(wx(x), q.sideTop + 0.004, s * (q.wc0 + 0.006)); };
const winTop = (x, s) => { const q = section(x); return new THREE.Vector3(wx(x), lerp(q.sideTop, q.yt - q.rr, .94), s * (lerp(q.wc0, q.wr, .94) + 0.006)); };
for (const s of [1, -1]) {
  // chrome window surround (DLO) + belt
  details.add(tube(sample(1.70, 4.66, 60, x => winBottom(x, s)), 0.007, MAT.chrome));
  details.add(tube(sample(1.74, 4.64, 60, x => winTop(x, s)), 0.006, MAT.chrome));
  // door shut lines
  const top = x => belt(x) - 0.03;
  for (const dx of [1.66, 2.88]) details.add(tube(sample(0.36, top(dx), 12, y => sidePt(dx, y, s, 0.002)), 0.0035, MAT.trim));
  details.add(tube(sample(0, 1, 16, k => { const x = lerp(3.92, 3.50, eOut(k)); return sidePt(x, lerp(top(3.92), WCY + 0.46, k), s, 0.002); }), 0.0035, MAT.trim));
  // flush door handles
  for (const hx of [2.55, 3.72]) { const hm = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.025, 0.02), MAT.chrome); hm.position.copy(sidePt(hx, 0.86, s, 0.0)); details.add(hm); }
  // lower cladding strip highlight
  details.add(tube(sample(1.42, 3.43, 40, x => sidePt(x, 0.345, s, 0.004)), 0.004, MAT.chrome));
  // seamless horizon lamps — wrap slightly onto the flanks
  details.add(tube(sample(0.10, 0.36, 10, x => sidePt(x, 0.745 + (x - 0.1) * 0.06, s, 0.004)), 0.007, MAT.drl));
  details.add(tube(sample(4.62, 4.95, 10, x => sidePt(x, 0.965, s, 0.004)), 0.009, MAT.tail));
}
// full-width front DRL & rear lamp bar
details.add(tube(sample(-0.86, 0.86, 40, z => new THREE.Vector3(wx(noseX(z)) + 0.006, 0.745, z)), 0.007, MAT.drl));
details.add(tube(sample(-0.86, 0.86, 40, z => new THREE.Vector3(wx(noseX(z, true)) - 0.006, 0.965, z)), 0.009, MAT.tail));
// front grille: dark parametric panel
{
  const c = document.createElement("canvas"); c.width = 512; c.height = 128; const g = c.getContext("2d");
  g.fillStyle = "#07080a"; g.fillRect(0, 0, 512, 128); g.strokeStyle = "#8d949c"; g.lineWidth = 1.3;
  for (let i = -20; i < 60; i++) { g.beginPath(); g.moveTo(i * 12, 0); g.lineTo(i * 12 + 64, 128); g.stroke(); g.beginPath(); g.moveTo(i * 12 + 64, 0); g.lineTo(i * 12, 128); g.stroke(); }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const nz = 24, ny = 6, pos = [], uv = [], idx = [];
  for (let iy = 0; iy <= ny; iy++) for (let iz = 0; iz <= nz; iz++) {
    const z = lerp(-0.78, 0.78, iz / nz), y = lerp(0.33, 0.66, iy / ny);
    pos.push(wx(noseX(z)) + 0.008, y, z); uv.push(iz / nz, iy / ny);
  }
  for (let iy = 0; iy < ny; iy++) for (let iz = 0; iz < nz; iz++) { const a = iy * (nz + 1) + iz, b = a + 1, c2 = a + nz + 1, d = c2 + 1; idx.push(a, b, c2, b, d, c2); }
  const gg = new THREE.BufferGeometry(); gg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); gg.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2)); gg.setIndex(idx); gg.computeVertexNormals();
  details.add(new THREE.Mesh(gg, revealable(new THREE.MeshStandardMaterial({ map: tex, metalness: 0.8, roughness: 0.35, side: THREE.DoubleSide }))));
}

/* cyan hologram feature lines */
const feature = new THREE.Group(); car.add(feature);
for (const s of [1, -1]) {
  feature.add(fat(sample(0.25, 4.80, 140, x => { const q = section(x); return new THREE.Vector3(wx(x), q.yb + q.rb, s * (q.w + 0.004)); }), CYAN, 1.6, .75));
  feature.add(fat(sample(0.12, 4.98, 140, x => edgePt(x, s, 0.004)), CYAN, 1.6, .8));
  feature.add(fat(sample(1.74, 4.64, 70, x => winTop(x, s)), CYAN, 1.4, .6));
  for (const dx of [1.66, 2.88]) feature.add(fat(sample(0.36, belt(dx) - 0.07, 6, y => sidePt(dx, y, s, 0.004)), CYAN, 1.2, .55));
}
feature.add(fat(sample(-0.86, 0.86, 40, z => new THREE.Vector3(wx(noseX(z)) + 0.006, 0.745, z)), CYAN, 2.2, .9));
feature.add(fat(sample(-0.86, 0.86, 40, z => new THREE.Vector3(wx(noseX(z, true)) - 0.006, 0.965, z)), RED, 2.0, .5));
feature.add(fat(sample(0.02, 5.0, 180, x => topPt(x, 0)), CYAN, 1.3, .5));

/* ---------- mirrors ---------- */
const mirrors = [];
for (const s of [1, -1]) {
  const g = new THREE.SphereGeometry(1, 24, 14); g.scale(0.12, 0.07, 0.10);
  const x = 1.78, p = new THREE.Vector3(wx(x) - 0.02, belt(x) + 0.075, s * (halfW(x) + 0.13));
  const holo = new THREE.Mesh(g, surfMat(CYAN, 0.12)); holo.position.copy(p); car.add(holo);
  const wire = new THREE.LineSegments(new THREE.WireframeGeometry(g), lineMat(CYAN, .10)); wire.position.copy(p); car.add(wire);
  const real = new THREE.Mesh(g, MAT.paint); real.position.copy(p); details.add(real);
  const stalk = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, 0.14), MAT.trim); stalk.position.set(p.x + 0.01, p.y - 0.035, s * (halfW(x) + 0.05)); details.add(stalk);
  mirrors.push(p);
}

/* ---------- wheels ---------- */
const wheels = new THREE.Group(); car.add(wheels);
const tireGeo = (() => {
  const prof = [[0.25,-0.118],[0.31,-0.124],[0.338,-0.112],[0.35,-0.07],[0.351,0],[0.35,0.07],[0.338,0.112],[0.31,0.124],[0.25,0.118]].map(([r, y]) => new THREE.Vector2(r, y));
  const g = new THREE.LatheGeometry(prof, 64); g.rotateX(Math.PI / 2); return g;
})();
for (const cx of [FX, RX]) for (const s of [1, -1]) {
  const grp = new THREE.Group();
  grp.position.set(wx(cx), WCY, s * (halfW(cx) - 0.15));
  const circ = (r, z, n = 64) => sample(0, 1, n, k => new THREE.Vector3(r * Math.cos(k * Math.PI * 2), r * Math.sin(k * Math.PI * 2), z));
  // hologram
  grp.add(fat(circ(TIRE_R, 0.12 * s), CYAN, 1.8, .9));
  grp.add(fat(circ(TIRE_R, -0.12 * s), CYAN, 1.2, .35));
  grp.add(fat(circ(0.25, 0.11 * s), CYAN, 1.4, .8));
  grp.add(fat(circ(0.06, 0.11 * s, 24), CYAN, 1.4, .8));
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2;
    grp.add(fat([new THREE.Vector3(0.06 * Math.cos(a), 0.06 * Math.sin(a), 0.11 * s), new THREE.Vector3(0.245 * Math.cos(a + .35), 0.245 * Math.sin(a + .35), 0.11 * s)], CYAN, 1.2, .6)); }
  const cyl = new THREE.CylinderGeometry(TIRE_R, TIRE_R, 0.24, 40, 1, false); cyl.rotateX(Math.PI / 2);
  grp.add(new THREE.Mesh(cyl, surfMat(BLUE, 0.15)));
  // real: tyre, turbine-style rim (alternating bright / dark blades)
  const real = new THREE.Group(); grp.add(real);
  real.add(new THREE.Mesh(tireGeo, MAT.tire));
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.25, 48), MAT.rimDark); face.position.z = 0.085 * s; if (s < 0) face.rotation.y = Math.PI; real.add(face);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(0.248, 0.008, 8, 64), MAT.rim); lip.position.z = 0.11 * s; real.add(lip);
  for (let i = 0; i < 20; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.18, 0.012), i % 2 ? MAT.rimDark : MAT.rim);
    const piv = new THREE.Group(); piv.rotation.z = i / 20 * Math.PI * 2; piv.position.z = 0.10 * s;
    b.position.y = 0.155; b.rotation.y = 0.75 * s; b.rotation.z = -0.32; piv.add(b); real.add(piv);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.06, 0.03, 32), MAT.tire); hub.rotation.x = Math.PI / 2; hub.position.z = 0.105 * s; real.add(hub);
  wheels.add(grp);
}

/* ---------- interior (x-ray) ---------- */
const interior = new THREE.Group(); car.add(interior);
function boxLines(cx, cy, cz, sx, sy, sz, tilt = 0) {
  const g = new THREE.BoxGeometry(sx, sy, sz); g.translate(0, sy / 2, 0); g.rotateZ(tilt); g.translate(cx, cy, cz);
  interior.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat(CYAN, .35)));
  interior.add(new THREE.Mesh(g, surfMat(BLUE, .08)));
}
const seats = [];
for (const [x, z] of [[2.72, 0.40], [2.72, -0.40], [3.62, 0.40], [3.62, -0.40]]) {
  const X = wx(x);
  boxLines(X, 0.40, z, 0.52, 0.12, 0.50);
  boxLines(X - 0.28, 0.48, z, 0.11, 0.66, 0.50, 0.18);
  seats.push({ X, z });
}
interior.add(fat(sample(-0.85, 0.85, 30, z => new THREE.Vector3(wx(1.98), 1.0 + 0.02 * Math.cos(z * 2), z)), CYAN, 1.4, .6));
const SW_C = new THREE.Vector3(wx(2.18), 1.0, -0.40);             // driver on the left (-Z)
const swRing = r => sample(0, 1, 48, k => { const a = k * Math.PI * 2; const v = new THREE.Vector3(0, r * Math.sin(a), r * Math.cos(a)); v.applyAxisAngle(new THREE.Vector3(0, 0, 1), -0.45); return v.add(SW_C); });
interior.add(fat(swRing(0.185), CYAN, 1.6, .6));
interior.add(fat([SW_C.clone(), new THREE.Vector3(wx(1.95), 0.86, -0.40)], CYAN, 1.4, .5));
const DISP = { x: 2.02, y0: 1.02, y1: 1.12, z0: -0.62, z1: 0.18 };          // wide panoramic display
const dispPts = (o = 0) => [[DISP.z0 - o, DISP.y0 - o], [DISP.z1 + o, DISP.y0 - o], [DISP.z1 + o, DISP.y1 + o], [DISP.z0 - o, DISP.y1 + o]]
  .map(([z, y]) => new THREE.Vector3(wx(DISP.x) - (y - DISP.y0) * 0.25, y, z));
interior.add(fat(dispPts(), CYAN, 1.2, .5, true));

/* =========================================================
   TAPE LINES (red) — drawn on in sequence, stay on the real car
   ========================================================= */
const tapes = [];
function tape(points, t0, dur = 0.6, width = 3.2, closed = false) {
  const l = fat(points, RED, width * 0.8, 0.9, closed);
  l.geometry.instanceCount = 0;
  l.userData.t0 = t0; l.userData.dur = dur;
  car.add(l); tapes.push(l);
}
const T = { door: 1.0, body: 1.3, molding: 1.55, mirror: 1.7, emblem: 1.82, display: 1.95, wheel: 2.05, seat: 2.15, rear: 4.6 };
for (const s of [1, -1]) {
  const near = s === 1;                                             // camera orbits on the +Z side
  const top = x => belt(x) - 0.045;
  const bot = 0.37;
  if (near) {
    tape([].concat(                                                  // front door
      sample(1.68, 2.86, 30, x => sidePt(x, top(x), s)),
      sample(top(2.86), bot, 10, y => sidePt(2.86, y, s)),
      sample(2.86, 1.68, 30, x => sidePt(x, bot, s)),
      sample(bot, top(1.68), 10, y => sidePt(1.68, y, s))), T.door, 0.7);
    const arch = (x, m) => WCY + Math.sqrt(Math.max(0, WR * WR - (x - RX) ** 2)) + m;
    tape([].concat(                                                  // rear door (wraps the arch)
      sample(2.90, 3.94, 28, x => sidePt(x, top(x), s)),
      sample(0, 1, 12, k => { const x = lerp(3.94, 3.50, eOut(k)); return sidePt(x, lerp(top(3.94), arch(3.50, .04), k), s); }),
      sample(3.50, 3.46, 6, x => sidePt(x, arch(x, .04), s)),
      sample(3.46, 2.90, 16, x => sidePt(x, bot, s)),
      sample(bot, top(2.90), 10, y => sidePt(2.90, y, s))), T.door + 0.08, 0.7);
  }
  tape(sample(0.18, 1.56, 40, x => edgePt(x, s)), T.body, 0.55);          // hood edge
  tape(sample(2.46, 4.00, 40, x => edgePt(x, s)), T.body + 0.08, 0.55);   // roof edge
  tape(sample(4.70, 4.98, 14, x => edgePt(x, s)), T.body + 0.16, 0.5);    // trunk edge
  if (!near) continue;
  tape(sample(1.72, 3.42, 40, x => sidePt(x, 0.50, s, 0.018)), T.molding, 0.55, 4.0);   // side molding
  const mp = mirrors[0];
  tape(sample(0, 1, 40, k => { const a = k * Math.PI * 2; return new THREE.Vector3(mp.x + 0.122 * Math.cos(a), mp.y + 0.072 * Math.sin(a), mp.z + 0.02); }), T.mirror, 0.45, 2.8);
}
const across = (x, t0) => { const e = section(x).edge; tape(sample(-e[0], e[0], 24, z => topPt(x, z)), t0, 0.45); };
across(0.18, T.body); across(1.56, T.body + .05); across(2.46, T.body + .1); across(4.0, T.body + .12); across(4.70, T.body + .18); across(4.98, T.body + .2);
const emblemRing = (x, rx, rz) => sample(0, 1, 40, k => { const a = k * Math.PI * 2; const xx = x + rx * Math.sin(a); return new THREE.Vector3(wx(xx), yTop(xx) + 0.014, rz * Math.cos(a)); });
tape(emblemRing(0.20, 0.035, 0.085), T.emblem, 0.45, 2.8);              // hood emblem
tape(emblemRing(4.90, 0.030, 0.075), T.rear, 0.5, 2.8);                 // trunk emblem (seen once camera swings round)
const nTapesExterior = tapes.length;
tape(dispPts(0.012), T.display, 0.5, 2.8, true);                         // display
tape(swRing(0.19), T.wheel, 0.5, 3.0);                                   // steering wheel
for (const { X, z } of seats.slice(1, 2)) {                               // driver seat heater pads
  tape([[0.19, 0.19], [-0.19, 0.19], [-0.19, -0.19], [0.19, -0.19]].map(([dx, dz]) => new THREE.Vector3(X + dx, 0.535, z + dz)), T.seat, 0.45, 2.6, true);
  tape([[0.10, 0.19], [0.56, 0.19], [0.56, -0.19], [0.10, -0.19]].map(([h, dz]) => new THREE.Vector3(X - 0.34 - Math.sin(0.18) * h, 0.48 + Math.cos(0.18) * h, z + dz)), T.seat + 0.1, 0.45, 2.6, true);
}

tapes.slice(nTapesExterior).forEach(l => l.userData.interior = true);

/* spark riding the head of each drawing tape */
const sparkTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.25, "rgba(255,120,110,.9)"); r.addColorStop(1, "rgba(255,40,40,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const sparks = tapes.map(() => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, toneMapped: false })); s.scale.setScalar(0.085); s.visible = false; car.add(s); return s; });

/* =========================================================
   ENVIRONMENT — grid floor, turntable rings, lights, scan, dust
   ========================================================= */
const key = new THREE.DirectionalLight(0xffffff, 0); key.position.set(3, 6, 4); scene.add(key);
const rimL = new THREE.DirectionalLight(0x3d7bff, 0); rimL.position.set(-5, 3, -4); scene.add(rimL);
const top = new THREE.SpotLight(0xdfeaff, 0, 20, 0.6, 0.6); top.position.set(0, 8, 0); scene.add(top);

const floorMat = new THREE.ShaderMaterial({
  uniforms: { uOpacity: { value: 0 }, uR: { value: 0 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform float uOpacity, uR; varying vec3 vW;
    void main(){
      vec2 c = vW.xz/0.6; vec2 g = abs(fract(c-0.5)-0.5)/fwidth(c);
      float line = 1.0 - min(min(g.x,g.y),1.0);
      vec2 c2 = vW.xz/3.0; vec2 g2 = abs(fract(c2-0.5)-0.5)/fwidth(c2);
      float line2 = 1.0 - min(min(g2.x,g2.y),1.0);
      float d = length(vW.xz);
      float fade = smoothstep(12.0, 2.5, d) * smoothstep(uR, uR-1.5, d);
      float pool = exp(-d*d*0.10)*0.05;
      vec3 col = vec3(0.10,0.42,1.0)*(line*0.22 + line2*0.28) + vec3(0.12,0.45,1.0)*pool;
      gl_FragColor = vec4(col*fade*uOpacity, 1.0);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMat); floor.rotation.x = -Math.PI / 2; scene.add(floor);
// contact shadow for the real car
const shadowMat = (() => { const c = document.createElement("canvas"); c.width = 256; c.height = 128; const g = c.getContext("2d");
  const r = g.createRadialGradient(128, 64, 4, 128, 64, 120); r.addColorStop(0, "rgba(0,0,0,.95)"); r.addColorStop(.55, "rgba(0,0,0,.6)"); r.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = r; g.fillRect(0, 0, 256, 128);
  return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, opacity: 0 }); })();
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 2.9), shadowMat); shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.004; scene.add(shadow);

const platform = new THREE.Group(); scene.add(platform);
const ringPts = (r, n = 128) => sample(0, 1, n, k => new THREE.Vector3(r * Math.cos(k * Math.PI * 2), 0.005, r * Math.sin(k * Math.PI * 2)));
platform.add(fat(ringPts(3.25), CYAN, 2.2, .9), fat(ringPts(3.38), CYAN, 1.0, .35), fat(ringPts(3.9), BLUE, 1.0, .35));
const ticks = (() => {
  const arr = []; for (let i = 0; i < 120; i++) { const a = i / 120 * Math.PI * 2, r0 = 3.44, r1 = i % 10 === 0 ? 3.62 : 3.51;
    arr.push(r0 * Math.cos(a), 0.005, r0 * Math.sin(a), r1 * Math.cos(a), 0.005, r1 * Math.sin(a)); }
  const g = new LineSegmentsGeometry(); g.setPositions(arr);
  const m = new LineMaterial({ color: CYAN, linewidth: 1.2, transparent: true, opacity: .45, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }); m.resolution.set(W, H);
  const l = new LineSegments2(g, m); l.userData.o = .45; platform.add(l); return l;
})();
const scanMat = new THREE.ShaderMaterial({
  uniforms: { uOpacity: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform float uOpacity; varying vec2 vUv; void main(){ float a = (1.0-vUv.y)*smoothstep(0.0,0.15,vUv.x)*smoothstep(1.0,0.85,vUv.x);
    gl_FragColor = vec4(vec3(0.3,0.75,1.0)*a*0.16*uOpacity, 1.0); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false,
});
const scan = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.9), scanMat); scan.rotation.y = Math.PI / 2; scan.position.y = 0.95; scene.add(scan);
const scanEdge = fat([new THREE.Vector3(0, 0.01, -1.3), new THREE.Vector3(0, 0.01, 1.3)], CYAN, 2.5, 1); scene.add(scanEdge);
const dust = (() => {
  const n = 260, p = new Float32Array(n * 3), seed = new Float32Array(n);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { const r = 1.5 + rnd() * 7, a = rnd() * Math.PI * 2; p[i * 3] = r * Math.cos(a); p[i * 3 + 1] = rnd() * 3.5; p[i * 3 + 2] = r * Math.sin(a); seed[i] = rnd(); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3)); g.setAttribute("seed", new THREE.BufferAttribute(seed, 1));
  const m = new THREE.ShaderMaterial({ uniforms: { uTime: uni.uTime, uOpacity: { value: 0 } },
    vertexShader: `attribute float seed; uniform float uTime; varying float vA;
      void main(){ vec3 p = position; p.y = mod(p.y + uTime*(0.08+seed*0.12), 3.5); vA = sin(3.14159*p.y/3.5)*(0.35+0.65*seed);
        vec4 mv = modelViewMatrix*vec4(p,1.); gl_PointSize = (1.5+seed*2.5)*(8.0/-mv.z); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform float uOpacity; varying float vA; void main(){ float d = length(gl_PointCoord-0.5); float a = smoothstep(0.5,0.0,d)*vA*uOpacity;
      gl_FragColor = vec4(vec3(0.45,0.78,1.0)*a, 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false });
  scene.add(new THREE.Points(g, m)); return m;
})();

/* ---------- post ---------- */
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.35, 0.3, 0.3);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const fadeEl = document.getElementById("fade");
const featureFat = fatIn(feature), wheelFat = fatIn(wheels), interiorFat = fatIn(interior), platFat = fatIn(platform);
const setOp = (list, k) => list.forEach(l => { l.material.opacity = l.userData.o * k; });

/* =========================================================
   RENDER(t)
   ========================================================= */
const target = new THREE.Vector3(0, 0.62, 0);
function render(t) {
  uni.uTime.value = t;
  const out = eInOut(seg(t, DUR - 0.5, DUR));

  // camera: front-right 3/4 → side → rear-right 3/4
  const k = eInOut(seg(t, 0, DUR));
  const az = THREE.MathUtils.degToRad(lerp(30, 138, k));
  const el = THREE.MathUtils.degToRad(lerp(14, 12, k));
  const dist = lerp(8.4, 7.4, k);
  camera.position.set(dist * Math.cos(el) * Math.cos(az), target.y + dist * Math.sin(el), dist * Math.cos(el) * Math.sin(az));
  camera.lookAt(target);

  // environment
  floorMat.uniforms.uOpacity.value = eOut(seg(t, 0.0, 1.2)) * lerp(1, 0.7, seg(t, 2.6, 3.6));
  floorMat.uniforms.uR.value = lerp(0, 14, eOut(seg(t, 0.0, 1.6)));
  const pr = eOut(seg(t, 0.1, 1.2));
  platform.scale.setScalar(lerp(0.6, 1, pr));
  setOp(platFat, pr);
  ticks.rotation.y = -t * 0.12;
  dust.uniforms.uOpacity.value = 0.45 * eOut(seg(t, 0.3, 1.5));

  // 1) hologram scan-in: front (+X) → rear
  const sk = eInOut(seg(t, 0.15, 1.15));
  const sx = lerp(2.9, -2.9, sk);
  uni.uScan.value = sk >= 1 ? -10 : sx;
  // 2) materialise the real car: second sweep, front → rear
  const rk = eInOut(seg(t, 2.55, 3.55));
  const rx = lerp(2.9, -2.9, rk);
  uni.uReal.value = rk <= 0 ? 10 : (rk >= 1 ? -10 : rx);
  const sweepOn = (k2, on) => Math.sin(Math.PI * k2) * (on ? 1 : 0);
  const s1 = sweepOn(sk, sk > 0 && sk < 1), s2 = sweepOn(rk, rk > 0 && rk < 1);
  scan.position.x = s1 > 0 ? sx : rx; scanMat.uniforms.uOpacity.value = Math.max(s1, s2);
  scanEdge.position.x = scan.position.x; scanEdge.material.opacity = Math.max(s1, s2);

  const holoOut = 1 - eInOut(seg(t, 2.65, 3.5));
  setOp(featureFat, eOut(seg(t, 0.45, 1.4)) * holoOut);
  setOp(wheelFat, eOut(seg(t, 0.35, 1.3)) * holoOut);
  setOp(interiorFat, eOut(seg(t, 0.9, 1.7)) * holoOut);

  // lights & bloom: hologram look → studio look
  const realK = eInOut(seg(t, 2.6, 3.6));
  key.intensity = 1.0 * realK; rimL.intensity = 0.5 * realK; top.intensity = 0;
  shadowMat.opacity = 0.85 * realK;
  bloom.threshold = lerp(0.3, 1.2, realK);
  bloom.strength = lerp(0.35, 0.15, realK);
  bloom.radius = 0.3;
  const lampK = eOut(seg(t, 3.35, 3.9));
  MAT.drl.emissiveIntensity = 1.1 * lampK;
  MAT.tail.emissiveIntensity = 1.4 * lampK;

  // tapes
  tapes.forEach((l, i) => {
    const q = eInOut(seg(t, l.userData.t0, l.userData.t0 + l.userData.dur));
    const n = l.userData.n, cnt = q * n;
    l.geometry.instanceCount = Math.ceil(cnt);
    const sp = sparks[i];
    if (q > 0 && q < 1) {
      const P = l.userData.pts, j = Math.min(n - 1, Math.floor(cnt)), f = cnt - j;
      sp.position.copy(P[j]).lerp(P[j + 1], f); sp.visible = false;
    } else sp.visible = false;
    l.material.opacity = 0.9 * (l.userData.interior ? holoOut : 1);
  });

  fadeEl.style.opacity = String(clamp(1 - eOut(seg(t, 0, 0.5)) + out));
  composer.render();
}

window.DURATION = DUR;
window.renderFrame = render;
window.__dbg = (az, el, dist, hideTapes = true) => { render(6.0); tapes.forEach(l => l.visible = !hideTapes); sparks.forEach(sp => sp.visible = false);
  const A = THREE.MathUtils.degToRad(az), E = THREE.MathUtils.degToRad(el);
  camera.position.set(dist*Math.cos(E)*Math.cos(A), 0.62 + dist*Math.sin(E), dist*Math.cos(E)*Math.sin(A)); camera.lookAt(0, 0.62, 0); composer.render(); fadeEl.style.opacity = 0; };
render(0);
window.sceneReady = Promise.resolve(true);

if (new URLSearchParams(location.search).get("play") === "1") {
  const st = performance.now();
  const tick = now => { render(((now - st) / 1000) % DUR); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
