  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.); }`,
  fragmentShader: `uniform float uT, uSeed; uniform vec2 uSpot; uniform vec4 uV; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
    void main(){ vec2 p = vUv;

      vec3 deep = lin(vec3(0.22, 0.58, 0.84)), sky = lin(vec3(0.68, 0.87, 0.96)), mint = lin(vec3(0.70, 0.91, 0.93));
      vec2 dir = vec2(cos(uV.x), sin(uV.x));

      c = mix(c, mint, uV.w * smoothstep(0.35, 1.0, 1.0 - p.y) * smoothstep(0.85, 0.0, p.x));

      for (int i = 0; i < 3; i++) { float fi = float(i);
        float y0 = uV.y + fi * 0.06 + 0.05 * sin(p.x * 2.1 + uT * 0.22 + fi * 1.9 + uSeed) + uV.z * (p.x - 0.45) * (1.0 + fi * 0.25);
        float d = p.y - y0; float core = exp(-d * d * (14000.0 / (1.0 + fi * 1.5))); float haze = exp(-d * d * 220.0);
        float fx = smoothstep(-0.1, 0.55, p.x);
        c += vec3(1.0) * (core * 0.28 + haze * 0.07) * fx * (1.0 - fi * 0.28); }

      vec2 b = (p - uSpot) * vec2(1.1, 2.0); c += vec3(0.85, 0.95, 1.0) * exp(-dot(b, b) * 2.6) * 0.18;
      // drifting translucent bubbles
      for (int i = 0; i < 4; i++) { float fi = float(i);
        vec2 ctr = vec2(fract(0.12 + fi * 0.29 + uSeed * 0.37 + uT * (0.006 + fi * 0.002)), 0.15 + fract(fi * 0.37 + uSeed * 0.21) * 0.72 + 0.02 * sin(uT * 0.4 + fi));
        float r = 0.035 + 0.055 * fract(fi * 0.61 + uSeed * 0.13); float dd = length((p - ctr) * vec2(1.78, 1.0));
        float body = smoothstep(r, r - 0.006, dd); float rim = exp(-pow((dd - r) * 140.0, 2.0));
        c += vec3(1.0) * (body * (0.025 + 0.05 * smoothstep(r * 0.3, r, dd)) + rim * 0.05); }

      vec2 gp = p * vec2(160.0, 90.0); vec2 id = floor(gp); vec2 f = fract(gp) - 0.5; float rnd = h(id);
      if (rnd > 0.982) { float tw = 0.5 + 0.5 * sin(uT * 2.6 + rnd * 80.0); c += vec3(1.0) * exp(-dot(f, f) * 45.0) * tw * 0.3 * smoothstep(0.0, 0.8, 1.15 - p.y); }
      c += (h(p * 913.0 + uT) - 0.5) * 0.004;

  transparent: true, depthWrite: false, uniforms: { uT: bgU.uT, uA: { value: 0.16 } },
  vertexShader: `uniform float uT; varying vec3 vW; varying vec2 vP;
    float Hh(vec2 p){ return 0.75*sin(0.30*p.x + 0.42*p.y + uT*0.32) + 0.45*sin(0.52*p.y - 0.2*p.x + uT*0.26) + 0.22*sin(0.85*p.x + uT*0.45); }
    void main(){ vec3 p = position; vP = p.xz; p.y += Hh(p.xz); vec4 w = modelMatrix * vec4(p, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uT, uA; varying vec3 vW; varying vec2 vP;
    void main(){

  depthWrite: false, depthTest: false, uniforms: bgU,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.); }`,
  fragmentShader: `uniform float uT, uSeed; uniform vec2 uSpot; uniform vec4 uV; varying vec2 vUv;

    vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
    void main(){ vec2 p = vUv;
      // uV = (sweep angle, horizon height, sweep speed, spot strength); uSpot = top spot position

      for (int i = 0; i < 2; i++) { float fi = float(i);

        vec2 C = vec2(0.5 + side * (0.95 + 0.05 * sin(uT * 0.18 + fi + uSeed)), -0.35 + fi * 1.1 + 0.06 * cos(uT * 0.15 + uSeed + fi));

const BG_GRAY = [[-0.75, 0.24, 0.035, 1.0, 0.0, 0.5, 1.02], [0.55, 0.30, -0.05, 0.9, 1.3, 0.64, 1.05], [-1.1, 0.21, 0.06, 1.0, 2.1, 0.40, 1.02],

/* ---------- geometry helpers ---------- */
function rrShape(w, h, r, path = false) {
  const s = path ? new THREE.Path() : new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function extrude(shape, depth, bevel = 0) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(1e-4, depth - 2 * bevel), bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 36 });
  g.translate(0, 0, -(depth - 2 * bevel) / 2); return g;
}
const slab = (w, h, r, d, mat, bevel = 0) => new THREE.Mesh(extrude(rrShape(w, h, r), d, bevel), mat);
function frameGeo(w, h, r, b, d, bevel = 0) { const s = rrShape(w, h, r); s.holes.push(rrShape(w - 2 * b, h - 2 * b, Math.max(0.002, r - b), true)); return extrude(s, d, bevel); }
const frame = (w, h, r, b, d, mat, bevel = 0) => new THREE.Mesh(frameGeo(w, h, r, b, d, bevel), mat);
const flat = m => { m.geometry.rotateX(-PI / 2); return m; };
const box = (x, y, z, mat) => new THREE.Mesh(new THREE.BoxGeometry(x, y, z), mat);
const rbox = (x, y, z, r, mat) => new THREE.Mesh(new RoundedBoxGeometry(x, y, z, 3, r), mat);
const cyl = (r, h, mat, seg = 48, open = false, r2) => new THREE.Mesh(new THREE.CylinderGeometry(r2 ?? r, r, h, seg, 1, open), mat);
const tubeAlong = (pts, r, mat, closed = false, segs) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, closed, "catmullrom", 0.2), segs || Math.max(16, pts.length * 4), r, 10, closed), mat);
const smp = (a, b, n, f) => Array.from({ length: n + 1 }, (_, i) => f(lerp(a, b, i / n)));
function contactShadow(w, d, o = 0.7) {
  const t = canvasTex(256, 256, g => { const r = g.createRadialGradient(128, 128, 4, 128, 128, 128); r.addColorStop(0, `rgba(0,0,0,${o})`); r.addColorStop(.55, `rgba(0,0,0,${o * .45})`); r.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = r; g.fillRect(0, 0, 256, 256); });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  m.rotation.x = -PI / 2; m.position.y = 0.002; return m;
}
// ribbon (flat tape with thickness) following a path; nrm(i) gives the surface normal per point
function ribbon(pts, nrm, width, thick, mat) {
  const pos = [], idx = []; const n = pts.length;
  for (let i = 0; i < n; i++) {
    const t = pts[Math.min(n - 1, i + 1)].clone().sub(pts[Math.max(0, i - 1)]).normalize();
    const N = nrm(i).clone().normalize(), b = new THREE.Vector3().crossVectors(t, N).normalize().multiplyScalar(width / 2), up = N.clone().multiplyScalar(thick);
    const p = pts[i];
    pos.push(...p.clone().add(b).toArray(), ...p.clone().sub(b).toArray(), ...p.clone().add(b).add(up).toArray(), ...p.clone().sub(b).add(up).toArray());
  }
  for (let i = 0; i < n - 1; i++) { const a = i * 4, c = (i + 1) * 4;
    idx.push(a + 2, c + 2, a + 3, a + 3, c + 2, c + 3, a, a + 1, c, a + 1, c + 1, c, a, c, a + 2, a + 2, c, c + 2, a + 1, a + 3, c + 1, a + 3, c + 3, c + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const uv = []; for (let i = 0; i < n; i++) uv.push(i / 8, 0, i / 8, 1, i / 8, 0, i / 8, 1); g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.material.side = THREE.DoubleSide; return m;
}
// fade helper: clones every material under `group` into a transparent copy and returns an opacity setter
function fadable(group) {
  const map = new Map();
  group.traverse(o => { if (!o.material) return; const mats = Array.isArray(o.material) ? o.material : [o.material];
    const cl = mats.map(m => { if (!map.has(m)) { const c = m.clone(); c.transparent = true; map.set(m, c); } return map.get(m); });
    o.material = Array.isArray(o.material) ? cl : cl[0]; });
  return a => map.forEach(m => { m.opacity = a; m.depthWrite = a > 0.98; m.visible = a > 0.002; });
}

// ---- smartphone (lying flat, screen up, long axis along Z)

  const tape = new THREE.Group();

  { const p = rbox(0.11, 0.026, 0.02, 0.009, M.chip); p.position.set(0, 0, h / 2 + 0.002); body.add(p); }
  for (let i = 0; i < 6; i++) for (const s of [-1, 1]) { const sp = cyl(0.007, 0.02, M.chip, 12); sp.rotation.x = PI / 2; sp.position.set(s * (0.12 + i * 0.025), 0, h / 2 + 0.002); body.add(sp); }
  for (const [x, z] of [[w / 2, -h / 2 + 0.2], [-w / 2, -h / 2 + 0.2], [w / 2, h / 2 - 0.2], [-w / 2, h / 2 - 0.2]]) { const a = box(0.004, 0.086, 0.012, M.phoneDark); a.position.set(x + Math.sign(x) * 0.0005, 0, z); body.add(a); }

  for (let i = 0; i < 6; i++) { const s = 0.06 + R() * 0.09; const c = box(s, 0.016, s * (0.7 + R() * 0.6), i % 2 ? M.shield : M.chip); c.position.set(-0.04 + R() * 0.26, 0.01, -0.62 + R() * 0.3); inner.add(c); }
  for (const [x, z, rad] of [[-0.21, -0.6, 0.058], [-0.21, -0.43, 0.058], [-0.07, -0.6, 0.04]]) {

function buildPaperLine() {

    const foot = box(0.18, 0.06, 3.7, M.machineDark); foot.position.set(s * (span / 2 + 0.06), 0.03, -0.4); g.add(foot);
  }
  const rollers = [[-1.55, 0.98], [-0.85, 0.9], [-0.15, 0.85], [0.55, 0.8], [1.25, 0.76]];

    for (const s of [-1, 1]) { const b = cyl(0.11, 0.08, M.machineDark, 32); b.rotation.z = PI / 2; b.position.set(s * (span / 2 + 0.1), y - 0.075, z); g.add(b);
      const nut = cyl(0.04, 0.03, M.chrome, 6); nut.rotation.z = PI / 2; nut.position.set(s * (span / 2 + 0.15), y - 0.075, z); g.add(nut); }
  }
  for (const s of [-1, 1]) { const mbox = rbox(0.2, 0.26, 0.3, 0.02, M.machineDark); mbox.position.set(s * (span / 2 + 0.2), 0.5, 0.2); g.add(mbox); }
  const rollG = new THREE.Group(); rollG.position.set(0, 1.12, -2.25); g.add(rollG);
  const rg = new THREE.CylinderGeometry(0.42, 0.42, span - 0.1, 96); rg.rotateZ(PI / 2);
  rollG.add(new THREE.Mesh(rg, [M.paper, M.rings, M.rings]));

  const tex = TEX.stripe.clone(); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.needsUpdate = true;
  const webMat = std({ color: "#b4b1aa", roughness: 0.92, emissive: "#ffffff", emissiveMap: tex, emissiveIntensity: 1.9, side: THREE.DoubleSide });
  const path = [V(0, 1.12 + 0.42, -2.25), ...rollers.map(([z, y]) => V(0, y + 0.002, z)), V(0, 0.62, 2.4)];

const CAR_GLTF = await new GLTFLoader().loadAsync("assets/car-model.glb");
{

  CAR_GLTF.scene.traverse(o => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.transparent) { m.envMapIntensity = 0.35; m.roughness = Math.max(m.roughness, 0.12); } });
    if (o.name === "Roof_glass") o.material = phys({ color: "#0c0f13", roughness: 0.35, transparent: true, opacity: 0.92, envMapIntensity: 0.25 });
    if (HIDE.test(o.name)) { o.visible = false; return; }
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    o.material = Array.isArray(o.material) ? mats.map(m => m.name === "body" ? pearl : m) : (mats[0].name === "body" ? pearl : mats[0]);
    o.userData.isBody = mats.some(m => m.name === "body");

function buildCar() {
  const C = new THREE.Group();
  const model = CAR_GLTF.scene.clone(true); model.rotation.y = PI / 2; C.add(model);   // model front (+Z) -> world +X, near side (model -X) -> world +Z
  C.updateMatrixWorld(true);
  const body = [], solid = [];
  model.traverse(o => { if (!o.isMesh || !o.visible) return; if (o.userData.isBody) body.push(o); if (!/interior/.test(o.name)) solid.push(o); });
  const rc = new THREE.Raycaster();
  const hit = (origin, dir, list, off = 0.007) => { rc.set(origin, dir); const h = rc.intersectObjects(list, false)[0]; if (!h) return null;
    const n = h.face.normal.clone().transformDirection(h.object.matrixWorld); if (n.dot(dir) > 0) n.negate(); return { p: h.point.clone().addScaledVector(n, off), n }; };
  const side = (x, y) => hit(V(x, y, 3), V(0, 0, -1), body);          // near-side surface at world (x, y)
  const top = (x, z, list = body) => hit(V(x, 3, z), V(0, -1, 0), list); // upper surface at world (x, z)
  // a closed outline given as 2D vertices -> dense surface points + normals
  const outline = (verts2d, cast, axis, step = 0.03) => { const pts = [], nrm = [];
    for (let i = 0; i < verts2d.length - 1; i++) { const [a, b] = [verts2d[i], verts2d[i + 1]]; const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
      for (let k = 0; k < n; k++) { const t = k / n, h = cast(lerp(a[0], b[0], t), lerp(a[1], b[1], t)); if (h) { pts.push(h.p); nrm.push(h.n); } } }
    const last = verts2d[verts2d.length - 1], h = cast(last[0], last[1]); if (h) { pts.push(h.p); nrm.push(h.n); }
    // smooth out seam gaps: median of the depth along the cast axis only (keeps the corners sharp)
    const n = pts.length, med = a => a.slice().sort((p, q) => p - q)[a.length >> 1];
    const sm = pts.map((p, i) => { const w = []; for (let k = -2; k <= 2; k++) w.push(pts[Math.min(n - 1, Math.max(0, i + k))][axis]); const q = p.clone(); q[axis] = med(w); return q; });
    const smn = nrm.map((v, i) => { const c = new THREE.Vector3(); for (let k = -2; k <= 2; k++) c.add(nrm[Math.min(n - 1, Math.max(0, i + k))]); return c.normalize(); });
    return { pts: sm, nrm: smn, poly: verts2d }; };
  const belt = x => 1.115 + (0.95 - x) * 0.035;
  const arc = (cx, cy, r, a0, a1, n) => smp(a0, a1, n, a => [cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  const frontDoor = [[0.96, belt(0.96)], [-0.06, belt(-0.06)], [-0.02, 0.42], [0.96, 0.42], [0.96, belt(0.96)]];
  const rearDoor = [[-0.1, belt(-0.1)], [-1.19, belt(-1.19)], [-1.1, 0.79], ...arc(-1.32, 0.37, 0.47, 1.08, 0.36, 10), [-0.86, 0.42], [-0.06, 0.42], [-0.1, belt(-0.1)]];
  const hw = x => 0.7 - 0.13 * clamp((x - 1.9) / 0.3);
  const hood = [[1.27, -hw(1.27)], ...smp(1.27, 2.18, 12, x => [x, hw(x)]).map(([x, z]) => [x, -z]).slice(1), ...smp(2.18, 1.27, 12, x => [x, hw(x)]), [1.27, -hw(1.27)]];
  const roof = [[0.32, -0.5], [0.32, 0.5], [-1.25, 0.5], [-1.25, -0.5], [0.32, -0.5]];
  const paths = {
    frontDoor: outline(frontDoor, (x, y) => side(x, y), "z"),
    rearDoor: outline(rearDoor, (x, y) => side(x, y), "z"),
    hood: outline(hood, (x, z) => top(x, z), "y"),
    roof: outline(roof, (x, z) => top(x, z, solid), "y"),
  };
  // protective film: copies of body triangles inside the hood and near-side door outlines, nudged off the paint
  const inPoly = (u, v, P) => { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > v) !== (yj > v) && u < (xj - xi) * (v - yi) / (yj - yi) + xi) c = !c; } return c; };
  const fpos = []; const A = new THREE.Vector3(), B = new THREE.Vector3(), Cc = new THREE.Vector3(), N = new THREE.Vector3(), G = new THREE.Vector3();
  for (const m of body) {
    const g = m.geometry, pa = g.attributes.position, idx = g.index; const cnt = idx ? idx.count : pa.count;
    for (let i = 0; i < cnt; i += 3) {
      const ia = idx ? idx.getX(i) : i, ib = idx ? idx.getX(i + 1) : i + 1, ic = idx ? idx.getX(i + 2) : i + 2;
      A.fromBufferAttribute(pa, ia).applyMatrix4(m.matrixWorld); B.fromBufferAttribute(pa, ib).applyMatrix4(m.matrixWorld); Cc.fromBufferAttribute(pa, ic).applyMatrix4(m.matrixWorld);
      G.copy(A).add(B).add(Cc).multiplyScalar(1 / 3); N.subVectors(B, A).cross(Cc.clone().sub(A)).normalize();
      const sideFace = Math.abs(N.z) > 0.45 && G.z > 0.3 && (inPoly(G.x, G.y, frontDoor) || inPoly(G.x, G.y, rearDoor));
      const topFace = Math.abs(N.y) > 0.55 && inPoly(G.x, G.z, hood);
      if (!sideFace && !topFace) continue;
      const o = (sideFace ? V(0, 0, 1) : V(0, 1, 0)).multiplyScalar(0.004);
      for (const P of [A, B, Cc]) fpos.push(P.x + o.x, P.y + o.y, P.z + o.z);
    }
  }
  const fg = new THREE.BufferGeometry(); fg.setAttribute("position", new THREE.Float32BufferAttribute(fpos, 3)); fg.computeVertexNormals();
  const filmMat = phys({ color: "#cfe0f2", roughness: 0.25, clearcoat: 0.8, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
  C.add(new THREE.Mesh(fg, filmMat));
  C.add(contactShadow(5.8, 2.7, 0.8));
  return { C, filmMat, paths };
}

const SHOTS = [];
function shot(dur, build) { const g = new THREE.Group(); g.visible = false; scene.add(g); const s = build(g); s.g = g; s.dur = dur; SHOTS.push(s); }
function cam(p0, p1, t0, t1, k, fov = 30) { camera.position.copy(vlerp(p0, p1, k)); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(vlerp(t0, t1, k)); }
function lights(k, f, r, ki = 2, fi = 0.5, ri = 1.8, env = 0.7) {
  if (QS.get("bg") === "gray") { ki *= 1.6; fi *= 2.2; ri *= 1.2; env = Math.min(1.4, env * 2.2); } scene.environmentIntensity = env; key.position.copy(k); key.intensity = ki * 0.75; fill.position.copy(f); fill.intensity = fi; rim.position.copy(r); rim.intensity = ri * 1.2; }
function dof(point, aperture = 0.004, maxblur = 0.006) { bokeh.uniforms.focus.value = camera.position.distanceTo(point); bokeh.uniforms.aperture.value = aperture; bokeh.uniforms.maxblur.value = maxblur; }

/* camera helpers: motion never comes to a full stop, so hard cuts carry momentum */
const eOutCubic = eOut;
const eInOutSine = x => -(Math.cos(PI * x) - 1) / 2;
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const flow = u => 0.78 * u + 0.22 * eInOutSine(u);
const DEG = PI / 180;
function camOrbit(c, az0, az1, el0, el1, r0, r1, k, fov = 30) {
  const az = lerp(az0, az1, k) * DEG, el = lerp(el0, el1, k) * DEG, r = lerp(r0, r1, k);
  camera.position.set(c.x + r * Math.cos(el) * Math.cos(az), c.y + r * Math.sin(el), c.z + r * Math.cos(el) * Math.sin(az));
  camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(c);
}

/* 01 · 모바일 — 분해된 레이어가 위에서 아래로 순차 등장 / 오빗 */

/* car tape factory: ribbons that fade in hovering above the body, then press onto it */
function carTapes(K, defs) {
  return defs.map(([path, dir]) => { const r = ribbon(path.pts, i => path.nrm[i], 0.034, 0.004, M.tape.clone()); const grp = new THREE.Group(); grp.add(r); K.C.add(grp); return { grp, dir: dir.clone().normalize(), fade: fadable(grp) }; });
}
function driveTapes(list, u, t0) {
  const p = eOutCubic(seg(u, t0 + 0.06, t0 + 0.42)), a = eOut(seg(u, t0, t0 + 0.12)) * lerp(0.35, 1, p);
  list.forEach(o => { o.fade(a); o.grp.position.copy(o.dir).multiplyScalar(0.2 * (1 - p)); });

/* 07 · 자동차 — 정면에서 3/4로 도는 오빗, 테이프가 페이드 인 후 차체에 부착 */
shot(3.6, g => {
  const K = buildCar(); g.add(K.C);
  const T = carTapes(K, [[K.paths.frontDoor, V(0, 0.05, 1)], [K.paths.rearDoor, V(0, 0.05, 1)], [K.paths.hood, V(0, 1, 0.2)], [K.paths.roof, V(0, 1, 0.2)]]);
  const c = V(0.25, 0.8, 0.1);
  return { update(u) {
    driveTapes(T, u, 0.3); K.filmMat.opacity = 0.55 * eOutCubic(seg(u, 0.38, 0.72));
    camOrbit(c, 16, 52, 12, 18, 7.6, 6.7, flow(u), 30);
    lights(V(4, 3, 6), V(-3, 1.5, 3), V(-4, 2, -4), 1.0, 0.45, 0.8, 0.35);
    dof(V(1.0, 0.9, 1.0), 0.0012, 0.005);
  } };
});

/* 08 · 자동차 매크로 — 도어 라인을 따라가는 측면 트래킹 */
shot(2.4, g => {
  const K = buildCar(); g.add(K.C);
  const T = carTapes(K, [[K.paths.frontDoor, V(0, 0.05, 1)], [K.paths.rearDoor, V(0, 0.05, 1)]]);
  const fx = -0.04;
  return { update(u) {
    driveTapes(T, u, 0.14); K.filmMat.opacity = 0.55 * eOutCubic(seg(u, 0.2, 0.56));
    const f = flow(u);
    camera.position.copy(vlerp(V(fx - 1.0, 0.95, 2.1), V(fx + 0.6, 0.85, 2.0), f)); camera.fov = 40; camera.updateProjectionMatrix();
    const tg = vlerp(V(fx - 0.15, 0.62, 0.95), V(fx + 0.7, 0.55, 0.95), f); camera.lookAt(tg);
    lights(V(2, 3, 6), V(-3, 1, 3), V(-2, 1.5, -3), 1.0, 0.4, 0.6, 0.35);
    dof(V(fx, 0.6, 0.95), 0.012, 0.012);
  } };
});

/* 10 · 건축 — 오버헤드 오빗, 지그에 테이프 부착 후 자재판이 내려앉음 */
shot(3.0, g => {
  const K = buildCNC(); g.add(K.g); const fades = K.tapes.map(fadable); K.groove.visible = false; K.chips.visible = false;
  const c = V(0.05, 0.25, 0);
  return { update(u, t) {
    K.tapes.forEach((tp, i) => { const t0 = 0.05 + i * 0.07; fades[i](eOut(seg(u, t0, t0 + 0.14))); tp.position.y = 0.175 + 0.2 * (1 - eOutCubic(seg(u, t0 + 0.06, t0 + 0.34))); });
    const k = eInOutCubic(seg(u, 0.52, 0.92)); K.plate.position.set(0, lerp(1.7, 0.212, k), 0); K.plate.rotation.z = lerp(0.05, 0, k);
    K.head.position.set(0.95, 0.85, -0.25); K.tool.rotation.y = t * 30;
    camOrbit(c, 28, 72, 50, 36, 4.6, 3.9, flow(u), 30);
    lights(V(2, 5, 3), V(-3, 1.5, 2), V(-2, 3, -3), 1.2, 0.45, 1.1, 0.4);
    dof(c, 0.0025, 0.006);
  } };
});

/* 피날레 · 테이프 롤 — 회전하며 풀려 나오는 테이프, 가장자리에 시안 라인 */
shot(2.8, g => {
  const R0 = 0.32, R1 = 0.74, Wd = 0.46;
  const roll = new THREE.Group(); roll.position.set(0, R1, 0); g.add(roll);
  const ringTex = canvasTex(512, 512, (c, w, h) => { c.fillStyle = "#c9cdd2"; c.fillRect(0, 0, w, h); const r = rng(12);
    for (let i = 0; i < 120; i++) { c.strokeStyle = `rgba(${r() > .5 ? "255,255,255" : "70,75,82"},${0.08 + r() * 0.12})`; c.lineWidth = 1; c.beginPath(); c.arc(256, 256, 112 + i * 1.2, 0, 7); c.stroke(); }
    c.fillStyle = "#0000"; });
  const clear = phys({ color: "#f3f6f9", transmission: 0.55, roughness: 0.42, thickness: 0.15, ior: 1.4, side: THREE.DoubleSide, emissive: "#9aa6b2", emissiveIntensity: 0.12 });
  const faceM = clear.clone(); faceM.map = ringTex; faceM.transmission = 0.45;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R1, R1, Wd, 128, 1, true), clear); body.rotation.x = PI / 2; roll.add(body);
  for (const s of [1, -1]) {
    const face = new THREE.Mesh(new THREE.RingGeometry(R0 + 0.035, R1, 128, 1), faceM); face.position.z = s * Wd / 2; if (s < 0) face.rotation.y = PI; roll.add(face);
    const edge = new THREE.Mesh(new THREE.TorusGeometry(R1, 0.006, 8, 160), M.tape); edge.position.z = s * Wd / 2; roll.add(edge);
  }
  const coreTex = logoTex; coreTex.repeat.set(2, 1);
  const core = new THREE.Mesh(new THREE.CylinderGeometry(R0 + 0.035, R0 + 0.035, Wd + 0.01, 96, 1, true), std({ map: coreTex, roughness: 0.7 })); core.rotation.x = PI / 2; roll.add(core);
  const coreIn = new THREE.Mesh(new THREE.CylinderGeometry(R0, R0, Wd + 0.012, 96, 1, true), std({ map: coreTex, roughness: 0.75, side: THREE.BackSide })); coreIn.rotation.x = PI / 2; roll.add(coreIn);
  for (const s of [1, -1]) { const lip = new THREE.Mesh(new THREE.RingGeometry(R0, R0 + 0.035, 96, 1), std({ color: "#ecebe7", roughness: 0.8, side: THREE.DoubleSide })); lip.position.z = s * (Wd / 2 + 0.006); roll.add(lip); }
  // unrolled strip leaving the bottom of the roll, flowing toward +X
  const path = smp(0, 3.4, 120, x => V(x, 0.03 * Math.sin(x * 1.6) - 0.004, 0));
  const strip = ribbon(path, () => V(0, 1, 0), Wd, 0.008, clear.clone()); g.add(strip);
  const edges = [Wd / 2, -Wd / 2].map(zo => { const e = ribbon(path.map(p => p.clone().setZ(zo)), () => V(0, 1, 0), 0.014, 0.01, M.tape); g.add(e); return e; });
  const strips = [strip, ...edges]; const segIdx = 24, nSeg = path.length - 1;
  g.add(contactShadow(4.5, 2.2, 0.55));
  return { update(u) {
    const k = eOutCubic(seg(u, 0.0, 0.9)), len = lerp(0.12, 1, k);
    strips.forEach(m => m.geometry.setDrawRange(0, Math.floor(nSeg * len) * segIdx));
    roll.rotation.z = k * 3.4 / R1;
    const f = eOutCubic(u);
    camera.position.copy(vlerp(V(1.9, 0.95, 2.4), V(1.6, 1.25, 3.7), f)); camera.fov = 32; camera.updateProjectionMatrix();
    camera.lookAt(vlerp(V(0.6, 0.55, 0), V(0.95, 0.5, 0), f));
    lights(V(2, 4, 4), V(-3, 1.5, 2), V(-2, 3, -3), 1.3, 0.45, 1.1, 0.4);
    dof(V(0.3, 0.6, 0.2), 0.003, 0.006);
  } };
});

/* =========================================================
   timeline (hard cuts only)
   ========================================================= */
const STARTS = []; let acc = 0; for (const s of SHOTS) { STARTS.push(acc); acc += s.dur; }
const DUR = acc;
let current = -1;
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  let i = SHOTS.length - 1; while (i > 0 && t < STARTS[i]) i--;
  if (i !== current) { SHOTS.forEach((s, k) => s.g.visible = k === i); current = i; }
  const s = SHOTS[i], tl = t - STARTS[i];
  s.update(tl / s.dur, tl);
  updateBg(i, t);
  // gentle fade in at the very start and fade out at the very end (cuts everywhere else)
  document.getElementById("fade").style.opacity = String(Math.max(1 - eInOutSine(seg(t, 0, 0.6)), eInOutSine(seg(t, DUR - 0.8, DUR))));
  composer.render();
}
window.DURATION = DUR;
window.SHOT_STARTS = STARTS;
window.renderFrame = render;
// clones of the logo texture share the canvas image but need their own upload flag
function coreTexFix() { scene.traverse(o => { const m = o.material; if (m && m.map && m.map.userData && m.map.userData.canvas) m.map.needsUpdate = true; }); }
render(0);
window.sceneReady = logoReady.then(() => { coreTexFix(); render(0); return true; });
if (QS.get("play") === "1") { const st = performance.now(); const tick = now => { render(((now - st) / 1000) % DUR); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
</script>
