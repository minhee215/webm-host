<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const QS = new URLSearchParams(location.search);
const W = +(QS.get("w") || 1920), H = +(QS.get("h") || 1080), PI = Math.PI;
document.body.style.width = W + "px"; document.body.style.height = H + "px";

/* ---------- easing & utils ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eOutQuart = x => 1 - Math.pow(1 - x, 4);
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInOutQuart = x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2;
const eInOutExpo = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eOutBack = (x, c = 1.5) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const vlerp = (a, b, k) => a.clone().lerp(b, k);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.88;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.005, 200);
const pmrem = new THREE.PMREMGenerator(renderer);
// soft studio environment: gradient dome + large dim softboxes (no small hot spots)
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec3 vP; void main(){ float y = vP.y; vec3 c = mix(vec3(0.03), vec3(0.32,0.34,0.38), smoothstep(-0.3, 0.9, y)); gl_FragColor = vec4(c, 1.); }` })));
for (const [pos, sz, k] of [[[0, 12, 0], [14, 8], 0.95], [[-12, 4, 6], [6, 10], 0.55], [[12, 3, -6], [5, 8], 0.45]]) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(...sz), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k * 1.05), side: THREE.DoubleSide }));
  m.position.set(...pos); m.lookAt(0, 0, 0); envScene.add(m); }
scene.environment = pmrem.fromScene(envScene, 0.03).texture;
scene.environmentIntensity = 0.42;
const key = new THREE.DirectionalLight(0xffffff, 2); scene.add(key);
const fill = new THREE.DirectionalLight(0xa9c2ff, 0.5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xdce8ff, 1.8); scene.add(rim);

/* =========================================================
   BACKGROUND — studio spot gradient + slowly flowing ridged wave field
   ========================================================= */
const bgScene = new THREE.Scene();
const bgCam = new THREE.PerspectiveCamera(36, W / H, 0.1, 200);
bgCam.position.set(0, 2.6, 9); bgCam.lookAt(0, -0.4, -5);
const bgU = { uT: { value: 0 }, uSpot: { value: new THREE.Vector2(0.5, 1.02) } };
const grad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false, uniforms: bgU,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.); }`,
  fragmentShader: `uniform vec2 uSpot; uniform float uT; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){ vec2 p = vUv;
      // black studio gradient: dark top-left, soft charcoal toward bottom-right, faint floor line
      vec2 lc = vec2(0.78 + 0.03 * sin(uT * 0.25), 0.22 + 0.02 * cos(uT * 0.2));
      vec2 d = (p - lc) * vec2(1.5, 1.2); float glow = exp(-dot(d, d) * 1.6);
      float floorBand = smoothstep(0.0, 0.16, p.y) * (1.0 - smoothstep(0.16, 0.3, p.y)) * 0.35;
      vec3 c = vec3(0.011, 0.011, 0.012) + vec3(0.038, 0.038, 0.04) * glow + vec3(0.012) * floorBand * glow;
      c *= mix(0.82, 1.0, smoothstep(0.0, 0.45, p.x + (1.0 - p.y) * 0.2));
      c += (h(p * 913.0 + uT) - 0.5) * 0.002;
      gl_FragColor = vec4(c, 1.); }`,
}));
grad.renderOrder = -10; grad.frustumCulled = false; bgScene.add(grad);
const wave = new THREE.Mesh(new THREE.PlaneGeometry(44, 34, 220, 170).rotateX(-PI / 2), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, uniforms: { uT: bgU.uT, uA: { value: 0.16 } },
  vertexShader: `uniform float uT; varying vec3 vW; varying vec2 vP;
    float Hh(vec2 p){ return 0.75*sin(0.30*p.x + 0.42*p.y + uT*0.32) + 0.45*sin(0.52*p.y - 0.2*p.x + uT*0.26) + 0.22*sin(0.85*p.x + uT*0.45); }
    void main(){ vec3 p = position; vP = p.xz; p.y += Hh(p.xz); vec4 w = modelMatrix * vec4(p, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uT, uA; varying vec3 vW; varying vec2 vP;
    void main(){
      vec3 n = normalize(cross(dFdx(vW), dFdy(vW))); if (n.y < 0.) n = -n;
      float q = vP.y * 1.25 + 1.6 * sin(vP.x * 0.28 + uT * 0.22) + 0.9 * sin(vP.x * 0.11 - vP.y * 0.17 + uT * 0.15);
      float r = 0.5 + 0.5 * sin(6.2831 * q); float ridge = pow(r, 1.8); float groove = smoothstep(0.08, 0.0, r);
      float diff = clamp(dot(n, normalize(vec3(-0.25, 0.85, 0.45))), 0., 1.);
      float sh = 0.05 + 0.32 * diff * (0.35 + 0.65 * ridge) - groove * 0.05;
      float dist = length(vW - cameraPosition);
      float fade = smoothstep(30., 12., dist) * smoothstep(3., 7., dist);
      gl_FragColor = vec4(vec3(sh) * vec3(0.93, 0.96, 1.0), fade * uA); }`,
}));
wave.position.set(0, -1.2, -9); // wave field removed: plain black gradient background
const BG = [[0.0, 0.50], [0.6, 0.46], [-0.4, 0.55], [0.3, 0.52], [-0.7, 0.48], [0.9, 0.5], [0.15, 0.54], [-0.5, 0.47], [0.45, 0.5], [-0.2, 0.53], [0.75, 0.49]];
function updateBg(i, t) { const [ry, sx] = BG[i % BG.length]; wave.rotation.y = ry; bgU.uSpot.value.set(sx, 1.02); bgU.uT.value = t; }

/* ---------- post ---------- */
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(bgScene, bgCam));
const mainPass = new RenderPass(scene, camera); mainPass.clear = false; mainPass.clearDepth = true; composer.addPass(mainPass);
const bokeh = new BokehPass(scene, camera, { focus: 3, aperture: 0.004, maxblur: 0.006 }); composer.addPass(bokeh);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.28, 0.35, 1.25));
composer.addPass(new OutputPass());

/* ---------- textures ---------- */
function canvasTex(w, h, draw, repeat, srgb = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const TEX = {
  foam: canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#c21d16"; g.fillRect(0, 0, w, h); const r = rng(8);
    for (let i = 0; i < 9000; i++) { const a = r(); g.fillStyle = a > 0.6 ? `rgba(255,120,105,${r() * .35})` : `rgba(90,0,0,${r() * .3})`; g.fillRect(r() * w, r() * h, 1 + r() * 2.2, 1 + r() * 2.2); } }, [2, 2]),
  perforated: canvasTex(512, 256, (g, w, h) => { g.fillStyle = "#aeb4ba"; g.fillRect(0, 0, w, h); g.fillStyle = "#2a2e33";
    for (let y = 8; y < h; y += 16) for (let x = (y / 16 % 2) * 8 + 4; x < w; x += 16) { g.beginPath(); g.arc(x, y, 3.3, 0, 7); g.fill(); } }, [4, 1]),
  fiber: canvasTex(1024, 2048, (g, w, h) => { g.fillStyle = "#cfccc5"; g.fillRect(0, 0, w, h); const r = rng(5);
    for (let i = 0; i < 9000; i++) { g.strokeStyle = `rgba(${r() > .5 ? "250,248,244" : "120,115,105"},${0.12 + r() * 0.22})`; g.lineWidth = 0.6 + r() * 1.2;
      const x = r() * w, y = r() * h, a = r() * 6.28, L = 10 + r() * 40; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * L * .6, y + Math.sin(a + 1) * L * .6, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke(); }
    g.fillStyle = "#c41f18"; g.fillRect(0, 1180, w, 70); g.fillStyle = "rgba(255,255,255,.10)"; g.fillRect(0, 1184, w, 8); g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, 1246, w, 4); }),
  stripe: canvasTex(16, 2048, (g, w, h) => { g.fillStyle = "#000"; g.fillRect(0, 0, w, h); g.fillStyle = "#4cc8ff"; g.fillRect(0, 1180, w, 70); }),
  rings: canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#e3e0d9"; g.fillRect(0, 0, w, h); const r = rng(9);
    for (let i = 0; i < 170; i++) { g.strokeStyle = `rgba(120,110,95,${0.05 + r() * .1})`; g.lineWidth = 1 + r(); g.beginPath(); g.arc(256, 256, 30 + i * 1.33, 0, 7); g.stroke(); } }),
  brushed: canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#808080"; g.fillRect(0, 0, w, h); const r = rng(2);
    for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${r() > .5 ? "255,255,255" : "0,0,0"},${r() * .07})`; g.fillRect(0, r() * h, w, 1); } }, [2, 2], false),
};

/* ---------- materials ---------- */
const std = o => new THREE.MeshStandardMaterial(o);
const phys = o => new THREE.MeshPhysicalMaterial(o);
const M = {
  tape: std({ color: "#8fe2ff", roughness: 0.45, emissive: "#3cc4ff", emissiveIntensity: 2.6 }),
  phoneAlu: std({ color: "#8f959c", metalness: 1, roughness: 0.3, roughnessMap: TEX.brushed }),
  phoneDark: std({ color: "#2b2f35", metalness: 0.6, roughness: 0.45 }),
  backGlass: phys({ color: "#4a5058", roughness: 0.42, clearcoat: 0.5 }),
  display: phys({ color: "#05070a", roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.02 }),
  oledBack: std({ color: "#c7ccd2", metalness: 0.4, roughness: 0.45 }),
  battery: std({ color: "#32363b", roughness: 0.55, metalness: 0.2 }),
  pcb: std({ color: "#15201c", roughness: 0.45 }),
  shield: std({ color: "#b7bcc2", metalness: 1, roughness: 0.28 }),
  chip: std({ color: "#111214", roughness: 0.35 }),
  chrome: std({ color: "#d6dbe0", metalness: 1, roughness: 0.12 }),
  lens: phys({ color: "#05070c", roughness: 0.02, clearcoat: 1, sheen: 0.5, sheenColor: new THREE.Color("#3a5cff") }),
  enamel: phys({ color: "#cfd3d7", roughness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  steel: std({ color: "#7b8189", metalness: 0.9, roughness: 0.38 }),
  steelDark: std({ color: "#3d4248", metalness: 0.85, roughness: 0.45 }),
  stainless: std({ color: "#a9afb5", metalness: 1, roughness: 0.42, roughnessMap: TEX.brushed }),
  drum: std({ map: TEX.perforated, metalness: 0.9, roughness: 0.32, side: THREE.BackSide }),
  plastic: std({ color: "#c2c6ca", roughness: 0.5 }),
  glassDark: phys({ color: "#1b2430", roughness: 0.05, transparent: true, opacity: 0.6, clearcoat: 1 }),
  rubber: std({ color: "#151617", roughness: 0.9 }),
  paper: std({ color: "#c9c6bf", roughness: 0.9 }),
  rings: std({ map: TEX.rings, color: "#c4c1ba", roughness: 0.9 }),
  kraft: std({ color: "#a37650", roughness: 0.85 }),
  machine: std({ color: "#8a9097", metalness: 0.6, roughness: 0.45 }),
  machineDark: std({ color: "#3e444b", metalness: 0.7, roughness: 0.5 }),
  jig: std({ color: "#3b4046", metalness: 0.7, roughness: 0.5 }),
  bed: std({ color: "#8a9097", metalness: 0.7, roughness: 0.5, roughnessMap: TEX.brushed }),
  plate: std({ color: "#9ba0a6", metalness: 0.25, roughness: 0.6 }),
  hole: std({ color: "#0d0e10", roughness: 0.8 }),
};

/* ---------- geometry helpers ---------- */
function rrShape(w, h, r, path = false) {
  const s = path ? new THREE.Path() : new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function extrude(shape, depth, bevel = 0) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(1e-4, depth - 2 * bevel), bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 36 });
  g.translate(0, 0, -(depth - 2 * bevel) / 2); return g;
}
const slab = (w, h, r, d, mat, bevel = 0) => new THREE.Mesh(extrude(rrShape(w, h, r), d, bevel), mat);
function frameGeo(w, h, r, b, d, bevel = 0) { const s = rrShape(w, h, r); s.holes.push(rrShape(w - 2 * b, h - 2 * b, Math.max(0.002, r - b), true)); return extrude(s, d, bevel); }
const frame = (w, h, r, b, d, mat, bevel = 0) => new THREE.Mesh(frameGeo(w, h, r, b, d, bevel), mat);
const flat = m => { m.geometry.rotateX(-PI / 2); return m; };
const box = (x, y, z, mat) => new THREE.Mesh(new THREE.BoxGeometry(x, y, z), mat);
const rbox = (x, y, z, r, mat) => new THREE.Mesh(new RoundedBoxGeometry(x, y, z, 3, r), mat);
const cyl = (r, h, mat, seg = 48, open = false, r2) => new THREE.Mesh(new THREE.CylinderGeometry(r2 ?? r, r, h, seg, 1, open), mat);
const tubeAlong = (pts, r, mat, closed = false, segs) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, closed, "catmullrom", 0.2), segs || Math.max(16, pts.length * 4), r, 10, closed), mat);
const smp = (a, b, n, f) => Array.from({ length: n + 1 }, (_, i) => f(lerp(a, b, i / n)));
function contactShadow(w, d, o = 0.7) {
  const t = canvasTex(256, 256, g => { const r = g.createRadialGradient(128, 128, 4, 128, 128, 128); r.addColorStop(0, `rgba(0,0,0,${o})`); r.addColorStop(.55, `rgba(0,0,0,${o * .45})`); r.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = r; g.fillRect(0, 0, 256, 256); });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  m.rotation.x = -PI / 2; m.position.y = 0.002; return m;
}
// ribbon (flat tape with thickness) following a path; nrm(i) gives the surface normal per point
function ribbon(pts, nrm, width, thick, mat) {
  const pos = [], idx = []; const n = pts.length;
  for (let i = 0; i < n; i++) {
    const t = pts[Math.min(n - 1, i + 1)].clone().sub(pts[Math.max(0, i - 1)]).normalize();
    const N = nrm(i).clone().normalize(), b = new THREE.Vector3().crossVectors(t, N).normalize().multiplyScalar(width / 2), up = N.clone().multiplyScalar(thick);
    const p = pts[i];
    pos.push(...p.clone().add(b).toArray(), ...p.clone().sub(b).toArray(), ...p.clone().add(b).add(up).toArray(), ...p.clone().sub(b).add(up).toArray());
  }
  for (let i = 0; i < n - 1; i++) { const a = i * 4, c = (i + 1) * 4;
    idx.push(a + 2, c + 2, a + 3, a + 3, c + 2, c + 3, a, a + 1, c, a + 1, c + 1, c, a, c, a + 2, a + 2, c, c + 2, a + 1, a + 3, c + 1, a + 3, c + 3, c + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const uv = []; for (let i = 0; i < n; i++) uv.push(i / 8, 0, i / 8, 1, i / 8, 0, i / 8, 1); g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.material.side = THREE.DoubleSide; return m;
}
// fade helper: clones every material under `group` into a transparent copy and returns an opacity setter
function fadable(group) {
  const map = new Map();
  group.traverse(o => { if (!o.material) return; const mats = Array.isArray(o.material) ? o.material : [o.material];
    const cl = mats.map(m => { if (!map.has(m)) { const c = m.clone(); c.transparent = true; map.set(m, c); } return map.get(m); });
    o.material = Array.isArray(o.material) ? cl : cl[0]; });
  return a => map.forEach(m => { m.opacity = a; m.depthWrite = a > 0.98; m.visible = a > 0.002; });
}

/* =========================================================
   BUILDERS
   ========================================================= */
// ---- smartphone (lying flat, screen up, long axis along Z)
function buildPhone() {
  const w = 0.75, h = 1.6, r = 0.12, R = rng(17);
  const display = new THREE.Group();
  display.add(flat(slab(w, h, r, 0.016, M.display, 0.004)));
  const under = flat(slab(w - 0.05, h - 0.05, r - 0.025, 0.004, M.oledBack)); under.position.y = -0.009; display.add(under);
  const hole = new THREE.Mesh(new THREE.CircleGeometry(0.02, 32), std({ color: "#020203", roughness: 0.2 })); hole.rotation.x = -PI / 2; hole.position.set(0, 0.0085, -h / 2 + 0.07); display.add(hole);
  const holeRing = new THREE.Mesh(new THREE.RingGeometry(0.02, 0.026, 32), M.chrome); holeRing.rotation.x = -PI / 2; holeRing.position.set(0, 0.0086, -h / 2 + 0.07); display.add(holeRing);
  const tape = new THREE.Group();
  tape.add(flat(frame(w - 0.012, h - 0.012, r - 0.006, 0.032, 0.007, M.tape)));
  for (let i = 0; i < 10; i++) { const side = i % 2 ? 1 : -1, z = -0.6 + Math.floor(i / 2) * 0.3; const tab = box(0.05, 0.007, 0.07, M.tape); tab.position.set(side * (w / 2 - 0.06), 0, z); tape.add(tab); }
  for (const z of [-h / 2 + 0.05, h / 2 - 0.05]) { const tab = box(0.12, 0.007, 0.04, M.tape); tab.position.set(0.15, 0, z + (z < 0 ? 0.03 : -0.03)); tape.add(tab); }
  const body = new THREE.Group();
  body.add(flat(frame(w, h, r, 0.036, 0.085, M.phoneAlu, 0.008)));
  const shelf = flat(frame(w - 0.06, h - 0.06, r - 0.03, 0.022, 0.012, M.phoneDark)); shelf.position.y = 0.026; body.add(shelf);
  const floorP = flat(slab(w - 0.05, h - 0.05, r - 0.025, 0.01, M.phoneDark)); floorP.position.y = -0.035; body.add(floorP);
  for (const z of [-0.32, -0.16]) { const b = rbox(0.012, 0.028, 0.12, 0.005, M.phoneAlu); b.position.set(w / 2 + 0.004, 0, z); body.add(b); }
  { const b = rbox(0.012, 0.028, 0.16, 0.005, M.phoneAlu); b.position.set(-w / 2 - 0.004, 0, -0.22); body.add(b); }
  { const p = rbox(0.11, 0.026, 0.02, 0.009, M.chip); p.position.set(0, 0, h / 2 + 0.002); body.add(p); }
  for (let i = 0; i < 6; i++) for (const s of [-1, 1]) { const sp = cyl(0.007, 0.02, M.chip, 12); sp.rotation.x = PI / 2; sp.position.set(s * (0.12 + i * 0.025), 0, h / 2 + 0.002); body.add(sp); }
  for (const [x, z] of [[w / 2, -h / 2 + 0.2], [-w / 2, -h / 2 + 0.2], [w / 2, h / 2 - 0.2], [-w / 2, h / 2 - 0.2]]) { const a = box(0.004, 0.086, 0.012, M.phoneDark); a.position.set(x + Math.sign(x) * 0.0005, 0, z); body.add(a); }

  const tapes = [[-0.42, 0.2], [0.02, 0.05], [0.42, -0.1]].map(([z, x]) => { const t = new THREE.Group(); t.add(flat(slab(1.15, 0.12, 0.006, 0.006, M.tape))); t.position.set(x, 0.175, z); t.rotation.y = -0.18; g.add(t); return t; });

  for (let k = 0; k < 2; k++) { const pts = []; for (let i = 0; i <= 80; i++) { const a = i / 80 * PI * 2 * 2.2 + k * PI; pts.push(V(0.018 * Math.cos(a), -0.06 + i / 80 * 0.1, 0.018 * Math.sin(a))); } tool.add(tubeAlong(pts, 0.007, std({ color: "#d9dde2", metalness: 1, roughness: 0.15 }), false, 200)); }
  const core = cyl(0.012, 0.11, M.steelDark, 16); core.position.y = -0.01; tool.add(core);

/* =========================================================
   SHOTS
   ========================================================= */
const SHOTS = [];
function shot(dur, build) { const g = new THREE.Group(); g.visible = false; scene.add(g); const s = build(g); s.g = g; s.dur = dur; SHOTS.push(s); }
function cam(p0, p1, t0, t1, k, fov = 30) { camera.position.copy(vlerp(p0, p1, k)); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(vlerp(t0, t1, k)); }
function lights(k, f, r, ki = 2, fi = 0.5, ri = 1.8, env = 0.7) { scene.environmentIntensity = env; key.position.copy(k); key.intensity = ki * 0.75; fill.position.copy(f); fill.intensity = fi; rim.position.copy(r); rim.intensity = ri * 1.2; }
function dof(point, aperture = 0.004, maxblur = 0.006) { bokeh.uniforms.focus.value = camera.position.distanceTo(point); bokeh.uniforms.aperture.value = aperture; bokeh.uniforms.maxblur.value = maxblur; }

/* camera helpers: motion never comes to a full stop, so hard cuts carry momentum */
const eOutCubic = eOut;
const eInOutSine = x => -(Math.cos(PI * x) - 1) / 2;
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const flow = u => 0.78 * u + 0.22 * eInOutSine(u);
const DEG = PI / 180;
function camOrbit(c, az0, az1, el0, el1, r0, r1, k, fov = 30) {
  const az = lerp(az0, az1, k) * DEG, el = lerp(el0, el1, k) * DEG, r = lerp(r0, r1, k);
  camera.position.set(c.x + r * Math.cos(el) * Math.cos(az), c.y + r * Math.sin(el), c.z + r * Math.cos(el) * Math.sin(az));
  camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(c);
}

/* 01 · 모바일 — 분해된 레이어가 위에서 아래로 순차 등장 / 오빗 */
shot(3.6, g => {
  const P = buildPhone(); const root = new THREE.Group(); root.rotation.y = 0.35; g.add(root);
  const layers = [P.display, P.tape, P.body, P.inner, P.back];
  const rest = [1.05, 0.74, 0.38, 0.08, -0.22];
  const fades = layers.map(l => { root.add(l); return fadable(l); });
  const c = V(0.02, 0.42, 0.02);
  return { update(u) {
    layers.forEach((l, i) => {
      const t0 = 0.03 + i * 0.09, k = eOutCubic(seg(u, t0, t0 + 0.3));
      l.position.y = rest[i] + 0.13 * (1 - k) - 0.035 * i * eInOutSine(seg(u, 0.62, 1)) * 0.5;
      const s = lerp(0.94, 1, k); l.scale.set(s, 1, s);
      fades[i](eOut(seg(u, t0, t0 + 0.2)));
    });
    camOrbit(c, 22, 74, 30, 21, 5.0, 4.35, flow(u), 30);
    lights(V(1.5, 4, 1.5), V(-2.5, 1, 2), V(-1.5, 2.5, -3), 2.2, 0.5, 2.0);

});

  const Wm = buildWasher(); g.add(Wm.g);

  const c = V(0.22, 0.45, 0.0);
  return { update(u) {
    const k = eInOutCubic(seg(u, 0.04, 0.42));

      const front = base[i].z > 0, order = front ? (base[i].y > 0.4 ? 0 : 1) : (base[i].y > 0.4 ? 2 : 3);
      const t0 = 0.42 + order * 0.07, q = eOutCubic(seg(u, t0, t0 + 0.34)), r = 1 - q;
      const travel = front ? 0.95 : 1.25;
      p.position.set(base[i].x + (front ? 0.22 : 0.36) * r, base[i].y + 0.05 * r, base[i].z + travel * r);
      fades[i](eOut(seg(u, t0, t0 + 0.14)));

    lights(V(1.5, 2.2, 3.5), V(-2.5, 1.5, 1.5), V(-1, 2.5, -3), 1.2, 0.45, 0.9, 0.32);
    dof(V(0.3, 0.45, 0), 0.0025, 0.006);
  } };
});

/* car tape factory: ribbons that fade in hovering above the body, then press onto it */
function carTapes(K, defs) {
  return defs.map(([pts, nrm, dir]) => { const r = ribbon(pts, nrm, 0.036, 0.004, M.tape.clone()); const grp = new THREE.Group(); grp.add(r); K.C.add(grp); return { grp, dir: dir.clone().normalize(), fade: fadable(grp) }; });
}
function driveTapes(list, u, t0) {
  const p = eOutCubic(seg(u, t0 + 0.06, t0 + 0.42)), a = eOut(seg(u, t0, t0 + 0.12)) * lerp(0.35, 1, p);
  list.forEach(o => { o.fade(a); o.grp.position.copy(o.dir).multiplyScalar(0.2 * (1 - p)); });
}
// rear door: its trailing edge sweeps down and wraps around the rear wheel arch
const rearDoorPath = K => {
  const top = x => K.belt(x) - 0.06, arch = x => K.WCY + Math.sqrt(Math.max(0, K.WR * K.WR - (x - K.RX) ** 2)) + 0.045;
  return [].concat(
    smp(2.92, 3.80, 24, x => K.sp(x, top(x))),
    smp(0, 1, 14, k => { const x = lerp(3.80, 3.49, eInOutSine(k)); return K.sp(x, lerp(top(3.80), arch(3.49), k)); }),
    smp(3.49, 3.452, 6, x => K.sp(x, arch(x))),
    smp(arch(3.452), 0.4, 4, y => K.sp(3.452, y)),
    smp(3.452, 2.92, 18, x => K.sp(x, 0.4)),
    smp(0.4, top(2.92), 8, y => K.sp(2.92, y)));
};
const doorPath = (K, a, b) => [].concat(smp(a, b, 24, x => K.sp(x, K.belt(x) - 0.06)), smp(K.belt(b) - 0.06, 0.4, 8, y => K.sp(b, y)), smp(b, a, 24, x => K.sp(x, 0.4)), smp(0.4, K.belt(a) - 0.06, 8, y => K.sp(a, y)));

/* 07 · 자동차 — 정면에서 3/4로 도는 오빗, 테이프가 페이드 인 후 차체에 부착 */

  const K = buildCar(); g.add(K.C);
  const sideN = () => V(0, 0.12, 1), topN = () => V(0, 1, 0.35);
  const T = carTapes(K, [
    [doorPath(K, 1.70, 2.86), sideN, V(0, 0.05, 1)],
    [rearDoorPath(K), sideN, V(0, 0.05, 1)],
    [smp(0.42, 1.58, 36, x => K.hoodEdge(x, 1, 0.008)), topN, V(0, 1, 0.3)],
    [smp(0.42, 1.58, 36, x => K.hoodEdge(x, -1, 0.008)), () => V(0, 1, -0.35), V(0, 1, -0.3)],
    [smp(2.45, 3.62, 40, x => K.roofEdge(x, 1, 0.008)), topN, V(0, 1, 0.3)],
  ]);
  const c = V(0.3, 0.6, 0.1);
  return { update(u) {
    driveTapes(T, u, 0.3);
    camOrbit(c, 16, 52, 8, 12, 7.3, 6.4, flow(u), 30);
    lights(V(4, 1.8, 6), V(-3, 1.5, 3), V(-4, 1.5, -4), 1.0, 0.4, 0.55, 0.26);
    dof(V(1.2, 0.7, 1.0), 0.0012, 0.005);
  } };
});

/* 08 · 자동차 매크로 — 도어 라인을 따라가는 측면 트래킹 */

  const pts = [].concat(smp(K.belt(b) - 0.06, 0.4, 20, y => K.sp(b, y)), smp(b, a, 30, x => K.sp(x, 0.4)));
  const T = carTapes(K, [[pts, () => V(0, 0.1, 1), V(0, 0.05, 1)]]);
  const fx = K.sp(b, 0.62).x;

    const f = flow(u);
    camera.position.copy(vlerp(V(fx - 1.0, 0.8, 1.6), V(fx + 0.55, 0.72, 1.5), f)); camera.fov = 40; camera.updateProjectionMatrix();
    const tg = vlerp(V(fx - 0.15, 0.55, 0.95), V(fx + 0.75, 0.48, 0.95), f); camera.lookAt(tg);
    lights(V(2, 2, 6), V(-3, 1, 3), V(-2, 1.5, -3), 1.0, 0.4, 0.6, 0.28);
    dof(V(fx, 0.55, 0.95), 0.012, 0.012);
  } };
});

/* 10 · 건축 — 오버헤드 오빗, 지그에 테이프 부착 후 자재판이 내려앉음 */
shot(3.0, g => {
  const K = buildCNC(); g.add(K.g); const fades = K.tapes.map(fadable); K.groove.visible = false; K.chips.visible = false;
  const c = V(0.05, 0.25, 0);
  return { update(u, t) {
    K.tapes.forEach((tp, i) => { const t0 = 0.05 + i * 0.07; fades[i](eOut(seg(u, t0, t0 + 0.14))); tp.position.y = 0.175 + 0.2 * (1 - eOutCubic(seg(u, t0 + 0.06, t0 + 0.34))); });
    const k = eInOutCubic(seg(u, 0.44, 0.86)); K.plate.position.set(0, lerp(0.75, 0.212, k), 0); K.plate.rotation.z = lerp(0.05, 0, k);
    K.head.position.set(0.95, 0.85, -0.25); K.tool.rotation.y = t * 30;
    camOrbit(c, 28, 72, 50, 36, 4.6, 3.9, flow(u), 30);
    lights(V(2, 5, 3), V(-3, 1.5, 2), V(-2, 3, -3), 1.2, 0.45, 1.1, 0.4);
    dof(c, 0.0025, 0.006);
  } };
});

/* 피날레 · 테이프 롤 — 회전하며 풀려 나오는 테이프, 가장자리에 시안 라인 */
shot(2.8, g => {
  const R0 = 0.32, R1 = 0.74, Wd = 0.46;
  const roll = new THREE.Group(); roll.position.set(0, R1, 0); g.add(roll);
  const ringTex = canvasTex(512, 512, (c, w, h) => { c.fillStyle = "#c9cdd2"; c.fillRect(0, 0, w, h); const r = rng(12);
    for (let i = 0; i < 120; i++) { c.strokeStyle = `rgba(${r() > .5 ? "255,255,255" : "70,75,82"},${0.08 + r() * 0.12})`; c.lineWidth = 1; c.beginPath(); c.arc(256, 256, 112 + i * 1.2, 0, 7); c.stroke(); }
    c.fillStyle = "#0000"; });
  const faceM = std({ map: ringTex, roughness: 0.45, metalness: 0.1 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R1, R1, Wd, 128, 1, true), std({ color: "#c3c7cc", roughness: 0.4 })); body.rotation.x = PI / 2; roll.add(body);
  for (const s of [1, -1]) {
    const face = new THREE.Mesh(new THREE.RingGeometry(R0 + 0.035, R1, 128, 1), faceM); face.position.z = s * Wd / 2; if (s < 0) face.rotation.y = PI; roll.add(face);
    const edge = new THREE.Mesh(new THREE.TorusGeometry(R1, 0.006, 8, 160), M.tape); edge.position.z = s * Wd / 2; roll.add(edge);
  }
  const core = new THREE.Mesh(new THREE.CylinderGeometry(R0 + 0.035, R0 + 0.035, Wd + 0.01, 64, 1, true), std({ color: "#a37650", roughness: 0.8, side: THREE.DoubleSide })); core.rotation.x = PI / 2; roll.add(core);
  const coreIn = new THREE.Mesh(new THREE.CylinderGeometry(R0, R0, Wd + 0.012, 64, 1, true), std({ color: "#6e4f33", roughness: 0.9, side: THREE.BackSide })); coreIn.rotation.x = PI / 2; roll.add(coreIn);
  // unrolled strip leaving the bottom of the roll, flowing toward +X
  const path = smp(0, 3.4, 120, x => V(x, 0.03 * Math.sin(x * 1.6) - 0.004, 0));
  const strip = ribbon(path, () => V(0, 1, 0), Wd, 0.008, std({ color: "#c3c7cc", roughness: 0.4 })); g.add(strip);
  const edges = [Wd / 2, -Wd / 2].map(zo => { const e = ribbon(path.map(p => p.clone().setZ(zo)), () => V(0, 1, 0), 0.014, 0.01, M.tape); g.add(e); return e; });
  const strips = [strip, ...edges]; const segIdx = 24, nSeg = path.length - 1;
  g.add(contactShadow(4.5, 2.2, 0.55));
  return { update(u) {
    const k = eOutCubic(seg(u, 0.0, 0.9)), len = lerp(0.12, 1, k);
    strips.forEach(m => m.geometry.setDrawRange(0, Math.floor(nSeg * len) * segIdx));
    roll.rotation.z = k * 3.4 / R1;
    const f = eOutCubic(u);
    camera.position.copy(vlerp(V(1.9, 0.95, 2.4), V(1.6, 1.25, 3.7), f)); camera.fov = 32; camera.updateProjectionMatrix();
    camera.lookAt(vlerp(V(0.6, 0.55, 0), V(0.95, 0.5, 0), f));
    lights(V(2, 4, 4), V(-3, 1.5, 2), V(-2, 3, -3), 1.3, 0.45, 1.1, 0.4);
    dof(V(0.3, 0.6, 0.2), 0.003, 0.006);
  } };
});

/* =========================================================
   timeline (hard cuts only)
   ========================================================= */
const STARTS = []; let acc = 0; for (const s of SHOTS) { STARTS.push(acc); acc += s.dur; }
const DUR = acc;
let current = -1;
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  let i = SHOTS.length - 1; while (i > 0 && t < STARTS[i]) i--;
  if (i !== current) { SHOTS.forEach((s, k) => s.g.visible = k === i); current = i; }
  const s = SHOTS[i], tl = t - STARTS[i];
  s.update(tl / s.dur, tl);
  updateBg(i, t);
  composer.render();
}
window.DURATION = DUR;
window.SHOT_STARTS = STARTS;
window.renderFrame = render;
render(0);
window.sceneReady = Promise.resolve(true);
if (QS.get("play") === "1") { const st = performance.now(); const tick = now => { render(((now - st) / 1000) % DUR); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
</script>
