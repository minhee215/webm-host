<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const QS = new URLSearchParams(location.search);
const W = +(QS.get("w") || 1920), H = +(QS.get("h") || 1080), PI = Math.PI;
document.body.style.width = W + "px"; document.body.style.height = H + "px";

/* ---------- utils ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eSoft = x => x * x * (3 - 2 * x);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const vlerp = (a, b, k) => a.clone().lerp(b, k);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- renderer / post ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.02, 200);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;

// backdrop: dark studio gradient
const backdrop = new THREE.Mesh(new THREE.SphereGeometry(80, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uTop: { value: new THREE.Color("#1c2431") }, uBot: { value: new THREE.Color("#040507") } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 uTop, uBot; varying vec3 vP; void main(){ float k = smoothstep(-0.35, 0.6, vP.y); gl_FragColor = vec4(mix(uBot, uTop, k), 1.); }`,
}));
// (studio backdrop replaced by the background scene)

const key = new THREE.DirectionalLight(0xffffff, 2); scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0x9db8ff, 0.5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xcfe0ff, 1.5); scene.add(rim);


/* =========================================================
   BACKGROUND — dotted globe + orbit rings + flowing data arcs (own scene, kept faint)
   ========================================================= */
const bgScene = new THREE.Scene();
const bgCam = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
const BG_ALPHA = { value: 0.32 };
const bgTime = { value: 0 };
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.); }`,
  fragmentShader: `varying vec2 vUv; void main(){ vec2 p = vUv - vec2(0.55, 0.55); p.x *= 1.78;
    float v = smoothstep(1.25, 0.0, length(p)); vec3 c = mix(vec3(0.008,0.010,0.016), vec3(0.036,0.046,0.068), v);
    gl_FragColor = vec4(c, 1.); }`,
})));
const bgRoot = new THREE.Group(); bgScene.add(bgRoot);
// dotted globe
const globe = new THREE.Group(); bgRoot.add(globe);
{
  const N = 14000, pos = new Float32Array(N * 3), a = new Float32Array(N); const r = rng(42);
  const hash = (x, y, z) => { const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return s - Math.floor(s); };
  const noise = (x, y, z) => { // cheap value-ish noise for "continent" clusters
    return (Math.sin(x * 2.1 + Math.sin(y * 1.7)) + Math.sin(y * 2.6 + Math.cos(z * 1.3)) + Math.sin(z * 2.3 + x * 0.9)) / 3; };
  for (let i = 0; i < N; i++) {
    const u = r() * 2 - 1, th = r() * PI * 2, s = Math.sqrt(1 - u * u);
    const x = s * Math.cos(th), y = u, z = s * Math.sin(th);
    pos.set([x * 6, y * 6, z * 6], i * 3);
    const n = noise(x * 2, y * 2, z * 2); a[i] = n > 0.12 ? 0.9 : (hash(x, y, z) > 0.86 ? 0.35 : 0.06);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("aA", new THREE.BufferAttribute(a, 1));
  globe.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { uA: BG_ALPHA }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    vertexShader: `attribute float aA; varying float vA; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.);
      vec3 n = normalize(mat3(modelViewMatrix)*position); vA = aA * (0.25 + 0.75*smoothstep(-0.2, 0.6, n.z) + 0.6*pow(1.0-abs(n.z), 3.0));
      gl_PointSize = 2.2 * (22.0 / -mv.z) * ${(H / 1080).toFixed(3)}; gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform float uA; varying float vA; void main(){ float d = length(gl_PointCoord-0.5); float k = smoothstep(0.5,0.1,d);
      gl_FragColor = vec4(vec3(0.72,0.80,0.95)*k*vA*uA, 1.); }`,
  })));
}
// line with travelling dashes
function flowLine(points, color, dashes, speed, base, gleam) {
  const g = new THREE.BufferGeometry().setFromPoints(points);
  const sAttr = new Float32Array(points.length); points.forEach((_, i) => sAttr[i] = i / (points.length - 1));
  g.setAttribute("aS", new THREE.BufferAttribute(sAttr, 1));
  return new THREE.Line(g, new THREE.ShaderMaterial({
    uniforms: { uA: BG_ALPHA, uT: bgTime, uC: { value: new THREE.Color(color) }, uD: { value: dashes }, uSp: { value: speed }, uB: { value: base }, uG: { value: gleam } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    vertexShader: `attribute float aS; varying float vS; void main(){ vS = aS; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uA, uT, uD, uSp, uB, uG; uniform vec3 uC; varying float vS;
      void main(){ float f = fract(vS*uD - uT*uSp); float dash = smoothstep(0.0,0.04,f)*smoothstep(0.55,0.45,f);
        float edge = smoothstep(0.0,0.08,vS)*smoothstep(1.0,0.92,vS);
        gl_FragColor = vec4(uC*(uB + uG*dash)*edge*uA, 1.); }`,
  }));
}
// orbit rings around the globe
for (let i = 0; i < 6; i++) {
  const R = 6.6 + i * 0.55, tilt = 1.2 + i * 0.05;
  const pts = []; for (let k = 0; k <= 256; k++) { const a = k / 256 * PI * 2; pts.push(V(R * Math.cos(a), 0, R * Math.sin(a))); }
  const l = flowLine(pts, "#c9d6ee", 1 + (i % 3), 0.05 + i * 0.015, 0.25, 0.9); l.rotation.set(tilt, 0, 0.25 - i * 0.07); globe.add(l);
}
// flowing data arcs
const arcs = new THREE.Group(); bgRoot.add(arcs);
{
  const r = rng(77);
  for (let i = 0; i < 90; i++) {
    const R = 14 + i * 0.09 + r() * 0.05, a0 = 0.35 + r() * 0.2, a1 = 1.55 + r() * 0.25;
    const pts = []; for (let k = 0; k <= 160; k++) { const a = lerp(a0, a1, k / 160); pts.push(V(R * Math.cos(a), R * Math.sin(a), (r() - 0.5) * 0.02 + i * -0.03)); }
    arcs.add(flowLine(pts, i % 5 ? "#6f86ad" : "#cdd9f0", 3 + Math.floor(r() * 9), 0.04 + r() * 0.12, 0.12 + r() * 0.1, 0.5 + r() * 0.6));
  }
}
// per-shot background framing (changes on each cut)
const BG_VIEWS = [
  { globe: [9, -1, -22], arcs: [-26, -18, -26], rz: 0.0 },
  { globe: [-10, 2, -24], arcs: [-20, -22, -28], rz: 0.5 },
  { globe: [8, 3, -20], arcs: [-28, -14, -30], rz: -0.2 },
  { globe: [11, -3, -26], arcs: [-24, -20, -24], rz: 0.25 },
  { globe: [-9, -2, -22], arcs: [-30, -16, -28], rz: 0.1 },
  { globe: [10, 1, -21], arcs: [-22, -24, -30], rz: 0.6 },
  { globe: [-11, 1, -24], arcs: [-26, -18, -26], rz: -0.3 },
  { globe: [9, -2, -20], arcs: [-28, -20, -28], rz: 0.35 },
  { globe: [12, 2, -28], arcs: [-24, -16, -26], rz: 0.0 },
  { globe: [-8, -1, -21], arcs: [-26, -22, -30], rz: 0.45 },
  { globe: [10, -1, -23], arcs: [-30, -18, -26], rz: -0.15 },
];
function updateBg(i, t) {
  const v = BG_VIEWS[i % BG_VIEWS.length];
  globe.position.set(...v.globe); globe.rotation.set(0.35, t * 0.06 + i * 0.7, 0.18);
  arcs.position.set(...v.arcs); arcs.rotation.set(0, 0, v.rz);
  bgTime.value = t;
}

const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(bgScene, bgCam));
const mainPass = new RenderPass(scene, camera); mainPass.clear = false; mainPass.clearDepth = true; composer.addPass(mainPass);
const bokeh = new BokehPass(scene, camera, { focus: 3, aperture: 0.004, maxblur: 0.008 });
composer.addPass(bokeh);
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.18, 0.35, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- textures ---------- */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const TEX = {
  perforated: canvasTex(512, 256, (g, w, h) => { g.fillStyle = "#b9bec4"; g.fillRect(0, 0, w, h); g.fillStyle = "#30353b";
    for (let y = 8; y < h; y += 16) for (let x = (y / 16 % 2) * 8 + 4; x < w; x += 16) { g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill(); } }, [3, 1]),
  paper: canvasTex(512, 1024, (g, w, h) => { g.fillStyle = "#f2f0ea"; g.fillRect(0, 0, w, h); const r = rng(5);
    for (let i = 0; i < 2600; i++) { g.strokeStyle = `rgba(150,140,120,${0.04 + r() * 0.05})`; g.lineWidth = 1; const x = r() * w, y = r() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - .5) * 8, y + r() * 26); g.stroke(); }
    g.fillStyle = "#c8231b"; g.fillRect(0, 470, w, 46); g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(0, 474, w, 6); }),
  rings: canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#e9e5dc"; g.fillRect(0, 0, w, h); const r = rng(9);
    for (let i = 0; i < 160; i++) { g.strokeStyle = `rgba(120,110,95,${0.05 + r() * .12})`; g.lineWidth = 1 + r(); g.beginPath(); g.arc(256, 256, 40 + i * 1.35, 0, 7); g.stroke(); } }),
  heater: canvasTex(512, 320, (g, w, h) => { g.fillStyle = "#8d9399"; g.fillRect(0, 0, w, h); g.strokeStyle = "#d4d8dc"; g.lineWidth = 16; g.lineJoin = "round";
    g.beginPath(); let x = 40; g.moveTo(x, 30); for (let i = 0; i < 9; i++) { g.lineTo(x, i % 2 ? 30 : h - 30); x += 48; g.lineTo(x, i % 2 ? 30 : h - 30); } g.stroke();
    g.strokeStyle = "#6e747a"; g.lineWidth = 3; g.stroke(); }),
  ribbed: canvasTex(256, 256, (g, w, h) => { g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 16) { g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(x, 0, 2, h); g.fillStyle = "rgba(255,255,255,.6)"; g.fillRect(x + 3, 0, 2, h); } }, [3, 1]),
  felt: canvasTex(256, 256, (g, w, h) => { g.fillStyle = "#2b2d30"; g.fillRect(0, 0, w, h); const r = rng(3);
    for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(${r() > .5 ? "255,255,255" : "0,0,0"},${r() * .08})`; g.fillRect(r() * w, r() * h, 2, 2); } }, [3, 3]),
  wood: canvasTex(512, 256, (g, w, h) => { g.fillStyle = "#d6c4a1"; g.fillRect(0, 0, w, h); const r = rng(11);
    for (let i = 0; i < 70; i++) { g.strokeStyle = `rgba(140,105,60,${0.05 + r() * .12})`; g.lineWidth = 1 + r() * 2; const y = r() * h; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + (r() - .5) * 20, w * .7, y + (r() - .5) * 20, w, y + (r() - .5) * 10); g.stroke(); } }),
};

/* ---------- materials ---------- */
const std = (o) => new THREE.MeshStandardMaterial(o);
const phys = (o) => new THREE.MeshPhysicalMaterial(o);
const M = {
  tape:    std({ color: "#c41f18", emissive: "#ff1e10", emissiveIntensity: 0.22, roughness: 0.5 }),
  floor:   std({ color: "#020203", roughness: 0.85, metalness: 0.0, envMapIntensity: 0.12 }),
  enamel:  phys({ color: "#c9cdd2", roughness: 0.32, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  chrome:  std({ color: "#d3d8de", metalness: 1, roughness: 0.14 }),
  alu:     std({ color: "#9aa1a9", metalness: 1, roughness: 0.36 }),
  aluDark: std({ color: "#5d646d", metalness: 0.9, roughness: 0.4 }),
  blackGlass: phys({ color: "#07090c", roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.03 }),
  display: phys({ color: "#05070b", roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.02, sheen: 0.3, sheenColor: new THREE.Color("#2a4a8a") }),
  darkPlastic: std({ color: "#1b1d21", roughness: 0.62 }),
  pcb:     std({ color: "#0f3a2c", roughness: 0.45, metalness: 0.1 }),
  chip:    std({ color: "#121316", roughness: 0.35 }),
  gold:    std({ color: "#c9a34a", metalness: 1, roughness: 0.28 }),
  foil:    std({ color: "#c7cbd0", metalness: 0.85, roughness: 0.33 }),
  copper:  std({ color: "#c87533", metalness: 0.7, roughness: 0.35 }),
  milky:   phys({ color: "#cfd8e4", roughness: 0.55, transparent: true, opacity: 0.45 }),
  led:     std({ color: "#ffffff", emissive: "#f4f8ff", emissiveIntensity: 2.2 }),
  paper:   std({ map: TEX.paper, color: "#d6d2c9", roughness: 0.88, side: THREE.DoubleSide }),
  paperPlain: std({ color: "#cfcbc2", roughness: 0.9 }),
  rings:   std({ map: TEX.rings, color: "#d0ccc3", roughness: 0.9 }),
  kraft:   std({ color: "#a87a4f", roughness: 0.85, side: THREE.DoubleSide }),
  heater:  std({ map: TEX.heater, metalness: 0.5, roughness: 0.4 }),
  mirror:  std({ color: "#e9eef4", metalness: 1, roughness: 0.03 }),
  metalPanel: std({ color: "#c3c7cc", metalness: 0.65, roughness: 0.42 }),
  felt:    std({ map: TEX.felt, roughness: 1 }),
  steel:   std({ color: "#3b4048", metalness: 0.8, roughness: 0.45 }),
  wood:    std({ map: TEX.wood, roughness: 0.75 }),
  drum:    std({ map: TEX.perforated, metalness: 0.9, roughness: 0.35, side: THREE.BackSide }),
  washerGlass: phys({ color: "#1d2733", roughness: 0.05, transparent: true, opacity: 0.55, clearcoat: 1 }),
};

// reveal-by-sweep clone of a material ('x' along local X range, or 'angle' around local origin in XY)
function sweep(base, mode, a = -1, b = 1) {
  const m = base.clone(); const u = { value: 0 }; m.userData.prog = u;
  m.onBeforeCompile = sh => {
    sh.uniforms.uProg = u;
    sh.vertexShader = "varying vec3 vLoc;\n" + sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\n vLoc = position;");
    const k = mode === "angle" ? "float k = (atan(-vLoc.y, -vLoc.x) + 3.14159265) / 6.2831853;"
      : mode === "z" ? `float k = (vLoc.z - (${a.toFixed(4)})) / ${(b - a).toFixed(4)};`
      : `float k = (vLoc.x - (${a.toFixed(4)})) / ${(b - a).toFixed(4)};`;
    sh.fragmentShader = "uniform float uProg; varying vec3 vLoc;\n" + sh.fragmentShader.replace("void main() {", `void main() {\n ${k}\n if (k > uProg) discard;`);
  };
  m.customProgramCacheKey = () => `${mode}${a}${b}`;
  return m;
}

/* ---------- geometry helpers ---------- */
function rrShape(w, h, r, path = false) {
  const s = path ? new THREE.Path() : new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function extrude(shape, depth, bevel = 0) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 32 });
  g.translate(0, 0, -depth / 2); return g;
}
const slab = (w, h, r, d, mat, bevel = 0) => new THREE.Mesh(extrude(rrShape(w, h, r), d, bevel), mat);
function frameGeo(w, h, r, b, d) { const s = rrShape(w, h, r); s.holes.push(rrShape(w - 2 * b, h - 2 * b, Math.max(0.002, r - b), true)); return extrude(s, d); }
const frame = (w, h, r, b, d, mat) => new THREE.Mesh(frameGeo(w, h, r, b, d), mat);
const flat = mesh => { mesh.geometry.rotateX(-PI / 2); return mesh; };         // XY-plane part → lying on XZ, thickness along Y
const box = (x, y, z, mat) => new THREE.Mesh(new THREE.BoxGeometry(x, y, z), mat);
const cyl = (r, h, mat, seg = 48, open = false) => new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg, 1, open), mat);
function strip(A, B, width, mat, vLen = 1) {   // flat quad from A to B, width along X
  const g = new THREE.BufferGeometry();
  const p = [A.x - width / 2, A.y, A.z, A.x + width / 2, A.y, A.z, B.x - width / 2, B.y, B.z, B.x + width / 2, B.y, B.z];
  g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute([0, 0, 1, 0, 0, vLen, 1, vLen], 2));
  g.setIndex([0, 2, 1, 1, 2, 3]); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}
function contactShadow(w, d, o = 0.75) {
  const t = canvasTex(256, 256, (g) => { const r = g.createRadialGradient(128, 128, 6, 128, 128, 128); r.addColorStop(0, `rgba(0,0,0,${o})`); r.addColorStop(.6, `rgba(0,0,0,${o * .5})`); r.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = r; g.fillRect(0, 0, 256, 256); });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  m.rotation.x = -PI / 2; m.position.y = 0.002; return m;
}
function floor(r = 8) { const f = new THREE.Mesh(new THREE.CircleGeometry(r, 64), M.floor); f.rotation.x = -PI / 2; return f; }
const tubeAlong = (pts, r, mat, closed = false) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, closed, "catmullrom", 0.2), Math.max(16, pts.length * 4), r, 10, closed), mat);

/* =========================================================
   SHOTS — each builds a group; update(u, t) drives camera + animation
   ========================================================= */
const SHOTS = [];
function shot(dur, build) { const g = new THREE.Group(); g.visible = false; scene.add(g); const s = build(g); s.g = g; s.dur = dur; SHOTS.push(s); }
function cam(p0, p1, t0, t1, u, fov = 30) {
  const k = eSoft(u);
  camera.position.copy(vlerp(p0, p1, k)); camera.fov = fov; camera.updateProjectionMatrix();
  const tg = vlerp(t0, t1, k); camera.lookAt(tg); return tg;
}
function lights(k, f, r, ki = 2, fi = 0.5, ri = 1.5) { ki *= 0.7; ri *= 1.25; key.position.copy(k); key.intensity = ki; fill.position.copy(f); fill.intensity = fi; rim.position.copy(r); rim.intensity = ri; }
function dof(point, aperture = 0.004, maxblur = 0.008) { bokeh.uniforms.focus.value = camera.position.distanceTo(point); bokeh.uniforms.aperture.value = aperture; bokeh.uniforms.maxblur.value = maxblur; }

/* ---------------- 01 · 가전 — 세탁기 측판 소음 방지 패드 ---------------- */
shot(2.7, g => {

    const p0 = TOP[Math.max(0, i - 1)], p1 = TOP[i], p2 = TOP[i + 1], p3 = TOP[Math.min(TOP.length - 1, i + 2)]; const q = (x - p1[0]) / (p2[0] - p1[0]), q2 = q * q, q3 = q2 * q;
    return 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * q + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * q2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * q3); };
  const FX = 0.98, RX = 3.875, WR = 0.43, WCY = 0.35;
  const belt = x => lerp(0.97, 1.02, clamp((x - 1.6) / 2.9));
  const yBot = x => { let y = 0.2; if (x < 0.3) y = 0.2 + 0.18 * (1 - x / 0.3) ** 2; if (x > 4.7) y = 0.2 + 0.25 * ((x - 4.7) / 0.33) ** 2;
    for (const c of [FX, RX]) { const d = x - c; if (Math.abs(d) < WR) y = Math.max(y, WCY + Math.sqrt(WR * WR - d * d)); } return y; };
  const halfW = x => { const t = Math.abs((x - L / 2) / (L / 2)); return 0.94 * Math.pow(Math.max(0, 1 - Math.pow(t, 4.2)), 0.3); };
  const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  function section(x) {
    const w = halfW(x), yt = yTop(x), yb = Math.min(yBot(x), yt - 0.06), bl = belt(x);
    const rb = Math.min(0.12, w * 0.4, (yt - yb) * 0.3), sideTop = Math.min(yt, bl), rs = Math.min(0.15, w * 0.35, (sideTop - yb) * 0.35);
    const cabH = Math.max(0, yt - bl), wc0 = Math.max(0, w - rs), wr = wc0 * (1 - 0.26 * smooth(0, 0.3, cabH)), rr = Math.min(0.1, cabH * 0.5, wr * 0.5);
    const pts = []; const push = (z, y) => pts.push([Math.max(0, z), y]);
    for (let i = 0; i < 3; i++) push(lerp(0, w - rb, i / 3), yb);
    for (let i = 0; i < 4; i++) { const a = -PI / 2 + (i / 3) * PI / 2; push(w - rb + rb * Math.cos(a), yb + rb + rb * Math.sin(a)); }
    for (let i = 1; i < 4; i++) push(w + 0.03 * Math.sin(PI * i / 4) * Math.min(1, w / 0.6), lerp(yb + rb, sideTop - rs, i / 4));
    for (let i = 0; i < 4; i++) { const a = (i / 3) * PI / 2; push(w - rs + rs * Math.cos(a), sideTop - rs + rs * Math.sin(a)); }
    for (let i = 1; i < 5; i++) push(lerp(wc0, wr, i / 5), lerp(sideTop, yt - rr, i / 5));
    for (let i = 0; i < 3; i++) { const a = (i / 2) * PI / 2; push(wr - rr + rr * Math.cos(a), yt - rr + rr * Math.sin(a)); }
    for (let i = 1; i <= 3; i++) push(lerp(wr - rr, 0, i / 3), yt);
    return { pts, w, yt, yb, sideTop, cabH };
  }
  const wx = x => L / 2 - x;
  const DOORS = [[1.70, 2.85], [2.92, 3.90]], filmTop = [[0.22, 1.55], [2.52, 3.95], [4.72, 4.97]];
  const inDoor = (x, y) => DOORS.some(([a, b]) => x > a && x < b) && y > 0.4 && y < 0.93;
  const NX = 220, xs = []; for (let i = 0; i <= NX; i++) xs.push(L * (0.5 - 0.5 * Math.cos(PI * i / NX)));
  const secs = xs.map(section), HN = secs[0].pts.length;
  const rings = xs.map((x, i) => { const s = secs[i]; return s.pts.map(([z, y]) => V(wx(x), y, z)).concat(s.pts.slice(1, -1).reverse().map(([z, y]) => V(wx(x), y, -z))); });
  const Mn = rings[0].length, halfIdx = j => j < HN ? j : 2 * HN - 2 - j;
  const pos = []; rings.forEach(r => r.forEach(p => pos.push(p.x, p.y, p.z)));
  const zones = [[], [], [], []];  // paint, film, glass, trim
  for (let i = 0; i < NX; i++) for (let j = 0; j < Mn; j++) {
    const a = i * Mn + j, b = i * Mn + (j + 1) % Mn, c = (i + 1) * Mn + j, d = (i + 1) * Mn + (j + 1) % Mn;
    const x = (xs[i] + xs[i + 1]) / 2, h = Math.min(halfIdx(j), halfIdx((j + 1) % Mn)), y = (rings[i][j].y + rings[i][(j + 1) % Mn].y) / 2, zr = rings[i][j].z;
    let zn = 0;
    if (h < 3 || (h < 10 && y < 0.36)) zn = 3;
    else if (h >= 13 && h < 18 && x > 1.64 && x < 4.7 && secs[i].cabH > 0.05) zn = 2;
    else if (h >= 18 && ((x > 1.66 && x < 2.5) || (x > 4.02 && x < 4.68))) zn = 2;
    else if (h >= 18 && filmTop.some(([p, q]) => x > p && x < q)) zn = 1;
    else if (h >= 7 && h < 14 && zr > 0 && inDoor(x, y)) zn = 1;
    zones[zn].push(a, b, c, b, d, c);
  }
  const bg = new THREE.BufferGeometry(); bg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  bg.setIndex(zones.flat()); let off = 0; zones.forEach((z, i) => { bg.addGroup(off, z.length, i); off += z.length; }); bg.computeVertexNormals();
  const C = new THREE.Group(); g.add(C);
  const carPaint = phys({ color: "#8c9198", metalness: 0.6, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.06 });
  const film = phys({ color: "#dfe2e5", roughness: 0.35, clearcoat: 0.6 });
  const glassM = phys({ color: "#06080b", roughness: 0.04, clearcoat: 1 });
  C.add(new THREE.Mesh(bg, [carPaint, film, glassM, M.darkPlastic]));
  for (const cx of [FX, RX]) for (const s of [1, -1]) {
    const wg = new THREE.Group(); wg.position.set(wx(cx), WCY, s * (halfW(cx) - 0.15)); C.add(wg);
    const tire = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.075, 20, 64), std({ color: "#141516", roughness: 0.85 })); wg.add(tire);
    const rimD = cyl(0.25, 0.2, M.alu, 48); rimD.rotation.x = PI / 2; wg.add(rimD);
    for (let i = 0; i < 10; i++) { const sp = box(0.03, 0.2, 0.02, M.aluDark); const pv = new THREE.Group(); pv.rotation.z = i / 10 * PI * 2; pv.position.z = 0.105 * s; sp.position.y = 0.13; sp.rotation.y = 0.5; pv.add(sp); wg.add(pv); }
  }
  for (const s of [1, -1]) { const mg = new THREE.SphereGeometry(1, 24, 14); mg.scale(0.12, 0.07, 0.1); const m = new THREE.Mesh(mg, carPaint); m.position.set(wx(1.78) - 0.02, belt(1.78) + 0.075, s * (halfW(1.78) + 0.13)); C.add(m); }
  const drl = tubeAlong(Array.from({ length: 21 }, (_, i) => { const z = lerp(-0.84, 0.84, i / 20); let a = 0, b = L / 2; for (let k = 0; k < 25; k++) { const m = (a + b) / 2; if (halfW(m) >= Math.abs(z)) b = m; else a = m; } return V(wx(b) + 0.006, 0.745, z); }), 0.008, std({ color: "#000", emissive: "#e9f4ff", emissiveIntensity: 1.2 }));
  C.add(drl);
  // red tape tubes along the film edges, drawn on
  const sideZ = (x, y) => { const P = section(x).pts.slice(3, 15); for (let i = 0; i < P.length - 1; i++) { const [z0, y0] = P[i], [z1, y1] = P[i + 1]; if ((y - y0) * (y - y1) <= 0 && y1 !== y0) return lerp(z0, z1, (y - y0) / (y1 - y0)); } return P[0][0]; };
  const sp = (x, y) => V(wx(x), y, sideZ(x, y) + 0.012);
  const topEdge = (x, s) => { const q = section(x).pts[18]; return V(wx(x), q[1] + 0.01, s * (q[0] + 0.01)); };
  const smp = (a, b, n, f) => Array.from({ length: n + 1 }, (_, i) => f(lerp(a, b, i / n)));
  const tapes = [];
  const T = (pts, t0) => { const m = tubeAlong(pts, 0.014, M.tape); m.userData.t0 = t0; m.userData.n = m.geometry.index.count; m.geometry.setDrawRange(0, 0); C.add(m); tapes.push(m); };
  DOORS.forEach(([a, b], i) => T([].concat(smp(a, b, 24, x => sp(x, 0.92)), smp(0.92, 0.41, 8, y => sp(b, y)), smp(b, a, 24, x => sp(x, 0.41)), smp(0.41, 0.92, 8, y => sp(a, y))), 0.0 + i * 0.08));
  filmTop.forEach(([a, b], i) => T([].concat(smp(a, b, 30, x => topEdge(x, 1)), smp(1, -1, 10, s => topEdge(b, s)), smp(b, a, 30, x => topEdge(x, -1)), smp(-1, 1, 10, s => topEdge(a, s))), 0.12 + i * 0.08));

  return { update(u) {
    tapes.forEach(m => { const k = eInOut(seg(u, m.userData.t0, m.userData.t0 + 0.55)); m.geometry.setDrawRange(0, Math.floor(m.userData.n * k / 3) * 3); });

/* ---------------- 10 · 건축 — PC 컬러 패널 부착 ---------------- */
shot(2.7, g => {
  const F = new THREE.Group(); g.add(F);
  const pal = ["#c9d3dc", "#2f6fae", "#d9a334", "#3e9a8c", "#e6e9ec", "#5a7fa8"];
  const pcMat = c => phys({ color: c, map: TEX.ribbed, roughness: 0.25, transparent: true, opacity: 0.82, clearcoat: 0.6 });
  for (let x = -3; x <= 3; x++) { const m = box(0.06, 4.2, 0.1, M.aluDark); m.position.set(x, 1.6, 0); F.add(m); }
  for (let y = -0.4; y <= 3.7; y += 1) { const m = box(6.1, 0.06, 0.1, M.aluDark); m.position.set(0, y + 0.1, 0); F.add(m); }
  const r = rng(13); const target = [0, 1.1];
  for (let ix = -3; ix < 3; ix++) for (let iy = 0; iy < 4; iy++) {
    const cx = ix + 0.5, cy = iy - 0.4 + 0.6; if (cx === target[0] + 0.5 && Math.abs(cy - target[1] - 0.5) < 0.01) continue;

  }

  const tc = sweep(M.tape, "x", -0.45, 0.45); const tcs = slab(0.045, 0.82, 0.005, 0.006, tc); tcs.rotation.z = PI / 2; tcs.position.copy(cell); F.add(tcs);

    const k = eInOut(seg(u, 0.42, 0.95));

/* ---------------- 11 · 건축 — 가공 전 자재 지그 고정 (CNC) ---------------- */
shot(2.5, g => {
  const bed = box(2.6, 0.14, 1.5, M.steel); bed.position.y = 0.07; g.add(bed);
  for (let z = -0.6; z <= 0.61; z += 0.3) { const s = box(2.6, 0.02, 0.05, std({ color: "#15171a", roughness: 0.6 })); s.position.set(0, 0.142, z); g.add(s); }

/* =========================================================
   timeline (hard cuts only)
   ========================================================= */
const STARTS = []; let acc = 0; for (const s of SHOTS) { STARTS.push(acc); acc += s.dur; }
const DUR = acc;
let current = -1;
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  let i = SHOTS.length - 1; while (i > 0 && t < STARTS[i]) i--;
  if (i !== current) { SHOTS.forEach((s, k) => s.g.visible = k === i); current = i; }
  const s = SHOTS[i], tl = t - STARTS[i];
  s.update(tl / s.dur, tl);
  updateBg(i, t);
  composer.render();
}
window.DURATION = DUR;
window.SHOT_STARTS = STARTS;
window.renderFrame = render;
render(0);
window.sceneReady = Promise.resolve(true);
if (new URLSearchParams(location.search).get("play") === "1") {
  const st = performance.now(); const tick = now => { render(((now - st) / 1000) % DUR); requestAnimationFrame(tick); }; requestAnimationFrame(tick);
}
